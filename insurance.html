<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>員工資料速撈 & 保險計算</title>
    <link rel="icon" href="img/logo.png" type="image/png">
    <style>
        :root {
            --bg-color: #121212; --text-main: #E0E0E0; --text-sub: #AAAAAA; --card-bg: #1E1E1E;
            --primary: #FFD54F; --border: #333; --highlight: #4285F4;
            --danger: #FF5252; --success: #66BB6A; --warning: #FF9800;
        }
        body.light-mode {
            --bg-color: #FDFCF4; --text-main: #1C1B1F; --text-sub: #666666; --card-bg: #FFF;
            --primary: #6F5D00; --border: #E0E0E0; --highlight: #1976D2;
        }
        body {
            font-family: 'MiSans', sans-serif; background: var(--bg-color); color: var(--text-main);
            margin: 0; padding: 15px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;
        }

        h2 { margin: 0 0 10px 0; color: var(--primary); text-align: center; font-size: 1.2rem; }

        /* 智慧解析區 */
        .smart-area {
            background: var(--card-bg); border: 1px dashed var(--highlight); border-radius: 12px;
            padding: 15px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px;
            transition: 0.3s;
        }
        .smart-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .smart-title { font-weight: bold; color: var(--highlight); display: flex; align-items: center; gap: 5px; }
        .smart-content { display: none; margin-top: 10px; animation: fadeIn 0.3s; }
        .smart-content.show { display: block; }
        
        textarea {
            width: 100%; height: 80px; background: rgba(0,0,0,0.2); border: 1px solid var(--border);
            color: var(--text-main); border-radius: 8px; padding: 8px; font-size: 12px; resize: none;
        }

        /* 選項區 */
        .options-box {
            display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 5px; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 8px;
        }
        .opt-item { font-size: 13px; display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
        .opt-item input { accent-color: var(--primary); }

        .missing-box {
            display: none; background: rgba(255, 82, 82, 0.1); border: 1px solid var(--danger);
            border-radius: 8px; padding: 10px; margin-top: 10px; font-size: 13px; color: var(--danger); line-height: 1.5;
        }

        .container { display: flex; gap: 15px; flex: 1; overflow: hidden; }
        @media (max-width: 768px) { .container { flex-direction: column; } }

        .panel {
            flex: 1; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border);
            display: flex; flex-direction: column; overflow: hidden; padding: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .panel-title { font-weight: bold; color: var(--text-main); font-size: 14px; }
        .count-badge { background: var(--highlight); color: white; padding: 2px 8px; border-radius: 10px; font-size: 12px; }

        .search-box {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
            background: rgba(125,125,125,0.1); color: var(--text-main); margin-bottom: 10px;
            box-sizing: border-box; outline: none;
        }

        .list-area {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
            padding: 5px; border: 2px dashed transparent; transition: 0.2s;
        }
        .list-area.drag-over { border-color: var(--highlight); background: rgba(66, 133, 244, 0.1); border-radius: 8px; }

        .staff-item {
            background: rgba(125,125,125,0.1); padding: 8px 12px; border-radius: 8px;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            border: 1px solid transparent; transition: 0.2s; user-select: none;
        }
        .staff-item:active { transform: scale(0.98); }
        .staff-item:hover { border-color: var(--primary); background: rgba(255, 213, 79, 0.1); }
        
        .s-info { display: flex; flex-direction: column; }
        .s-name { font-weight: bold; font-size: 15px; }
        .s-detail { font-size: 11px; color: var(--text-sub); display: flex; gap: 5px; }
        .s-action { font-size: 16px; color: var(--text-sub); }

        .selected-item { border-left: 4px solid var(--highlight); background: rgba(66, 133, 244, 0.1); }
        .date-tag { font-size: 10px; color: var(--highlight); background: rgba(66, 133, 244, 0.2); padding: 2px 5px; border-radius: 4px; margin-top: 2px;}

        .bottom-bar { margin-top: 15px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; }
        .btn {
            flex: 1; padding: 10px 5px; border: none; border-radius: 12px; min-width: 80px;
            font-weight: bold; cursor: pointer; font-size: 13px;
            display: flex; justify-content: center; align-items: center; gap: 5px; transition: 0.2s;
        }
        .btn:active { transform: scale(0.95); opacity: 0.8; }
        .btn-simple { background: var(--primary); color: #000; }
        .btn-excel1 { background: #0b5394; color: #fff; }
        .btn-excel2 { background: #217346; color: #fff; }
        .btn-parse { background: var(--success); color: #fff; width: 100%; margin-top: 5px; padding: 8px; border-radius: 8px; font-size: 14px;}
        .btn-clear { background: #444; color: #fff; flex: 0.3; }
        .btn-back { background: transparent; border: 1px solid var(--text-sub); color: var(--text-sub); flex: 0.2; text-decoration: none;}

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <h2>⚡ 員工資料速撈 & 保險計算</h2>

    <div class="smart-area">
        <div class="smart-header" onclick="toggleSmart()">
            <div class="smart-title">🤖 班表智慧匯入 (暴力解析版)</div>
            <div style="font-size: 12px; color: var(--text-sub);">支援多站點、複雜排班 ▼</div>
        </div>
        <div class="smart-content" id="smartContent">
            <textarea id="pasteArea" placeholder="請直接從 Google Sheet 全選班表區域 (包含日期列)，然後貼上到這裡..."></textarea>
            <div style="display:flex; gap:10px; margin-top:5px;">
                <input type="number" id="parseYear" value="2026" style="width:60px; padding:5px; border-radius:5px; border:1px solid #555; background:#333; color:#fff;" placeholder="年份">
                <button class="btn btn-parse" onclick="parseSchedule()">🔍 全域分析並帶入</button>
            </div>
            <div id="parseMsg" style="font-size:12px; color:var(--text-sub); margin-top:5px;"></div>
            <div id="missingBox" class="missing-box"></div>
        </div>
    </div>

    <div class="smart-area" style="border-color:var(--primary);">
        <div style="font-size:12px; margin-bottom:5px; color:var(--text-sub);">📝 簡易複製的選項 (僅影響"簡易複製"按鈕)</div>
        <div class="options-box">
            <label class="opt-item"><input type="checkbox" id="opt-bday" checked> 生日</label>
            <label class="opt-item"><input type="checkbox" id="opt-id" checked> 身分證</label>
            <label class="opt-item"><input type="checkbox" id="opt-phone" checked> 電話</label>
            <label class="opt-item"><input type="checkbox" id="opt-body" checked> 身高體重</label>
            <label class="opt-item"><input type="checkbox" id="opt-addr"> 地址</label>
        </div>
    </div>

    <div class="container">
        <div class="panel">
            <div class="panel-header"><span class="panel-title">👥 人員庫</span></div>
            <input type="text" id="searchInput" class="search-box" placeholder="搜尋姓名、電話..." oninput="renderSource()">
            <div id="sourceList" class="list-area"></div>
        </div>

        <div class="panel" style="border-color: var(--highlight);">
            <div class="panel-header"><span class="panel-title" style="color:var(--highlight);">📋 選取名單</span><span id="countBadge" class="count-badge">0 人</span></div>
            <div id="targetList" class="list-area">
                <div style="text-align:center; color:#666; font-size:12px; margin-top:20px;" id="emptyMsg">請從左側點擊，或使用上方智慧匯入</div>
            </div>
        </div>
    </div>

    <div class="bottom-bar">
        <a href="dashboard.html" class="btn btn-back">⬅️</a>
        <button class="btn btn-clear" onclick="clearTarget()">🗑️</button>
        <button class="btn btn-simple" onclick="generateSimpleFormat()">📋 簡易複製</button>
        <button class="btn btn-excel1" onclick="generateExcelFormatWithDate()">📊 結算核對(圖四)</button>
        <button class="btn btn-excel2" onclick="generateExcelFormatForInsurance()">🛡️ 保險上傳(圖五)</button>
    </div>

    <script>
        if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
        const cachedDB = localStorage.getItem('STAFF_DB_CACHE');
        if (!cachedDB) { alert('請先登入以同步資料'); window.location.href = 'index.html'; }
        
        const STAFF_DB = JSON.parse(cachedDB);
        let staffList = Object.values(STAFF_DB);
        staffList.sort((a, b) => new Date(b.entryDate || 0) - new Date(a.entryDate || 0));

        let selectedStaffData = new Map(); 
        renderSource(); renderTarget();

        function toggleSmart() { document.getElementById('smartContent').classList.toggle('show'); }

        // ==========================================
        // 🚀 V3.0 核彈級解析引擎 (無視一切排版亂象)
        // ==========================================
        function parseSchedule() {
            const text = document.getElementById('pasteArea').value;
            const year = document.getElementById('parseYear').value || new Date().getFullYear();
            const msgEl = document.getElementById('parseMsg');
            const missingBox = document.getElementById('missingBox');
            if (!text.trim()) { msgEl.innerText = "❌ 請先貼上資料"; return; }

            const rows = text.split('\n').map(row => row.split('\t'));
            
            // 將所有員工姓名與暱稱整理成陣列，並按「長度由長到短排序」
            // 這樣匹配 "林威旭" 時，才不會只匹配到 "林威"
            let allStaffNames = [];
            staffList.forEach(s => {
                if (s.name) allStaffNames.push({ name: s.name.toUpperCase(), phone: s.phone });
                if (s.alias) allStaffNames.push({ name: s.alias.toUpperCase(), phone: s.phone });
            });
            allStaffNames.sort((a, b) => b.name.length - a.name.length);

            let currentDateMap = {}; 
            let tempResults = {}; 
            let missingNames = new Set();

            // 逐行暴力掃描
            rows.forEach(row => {
                let isDateRow = false;
                let tempDateMap = {};
                let dateMatchCount = 0;

                // 1. 偵測這行是不是日期 Header
                row.forEach((cell, cIdx) => {
                    let match = cell.match(/(\d{1,2})[\/\.](\d{1,2})/);
                    if (match && !cell.includes("時間") && cell.length < 20) {
                        let d = new Date(year, parseInt(match[1])-1, parseInt(match[2]));
                        tempDateMap[cIdx] = d; 
                        dateMatchCount++;
                    }
                });

                // 只要這行有 2 個以上的日期，我就認定它是新的站點時間軸！(徹底解決 3/4 抓不到的問題)
                if(dateMatchCount >= 2) {
                    currentDateMap = tempDateMap;
                    isDateRow = true;
                }

                // 2. 如果這行是排班資料，且我們有目前站點的時間軸
                if (!isDateRow && Object.keys(currentDateMap).length > 0) {
                    row.forEach((cell, cIdx) => {
                        // 只處理「有對應日期」的欄位
                        if (currentDateMap[cIdx]) {
                            let cellText = cell.toUpperCase().trim();
                            if (!cellText || cellText.length < 2) return;
                            if (["XXX", "X", "休", "休息"].includes(cellText)) return;

                            // 暴力比對：只要字串裡包含這個人，就抓出來！
                            // 無視斜線 /、無視 +1、無視英文 NICK
                            allStaffNames.forEach(staff => {
                                if (cellText.includes(staff.name)) {
                                    if (!tempResults[staff.phone]) { 
                                        tempResults[staff.phone] = { dates: [] }; 
                                    }
                                    tempResults[staff.phone].dates.push(currentDateMap[cIdx].getTime());
                                    
                                    // 抓到就從字串中挖掉，避免影響後續判斷
                                    cellText = cellText.replace(staff.name, "");
                                }
                            });

                            // 抓漏機制：把常見符號、時間、常規詞彙清掉
                            let leftover = cellText.replace(/[0-9\-\+\/\(\)A-Za-z\.\:\s\{\}]/g, "");
                            const ignoreWords = ["進櫃", "撤櫃", "時間", "總時數", "當日時數", "上班", "開賣", "閉店"];
                            ignoreWords.forEach(w => leftover = leftover.replace(w, ""));

                            // 如果剩下的長度還有大於 2 的中文字，代表有我資料庫不認識的人
                            if (leftover.length >= 2) {
                                missingNames.add(leftover);
                            }
                        }
                    });
                }
            });

            // 計算結果寫入
            let count = 0;
            for (let phone in tempResults) {
                let data = tempResults[phone];
                // 陣列去重：即使一天出現兩次 (早晚班)，也只算 1 天
                let uniqueTimestamps = [...new Set(data.dates)].sort((a,b)=>a-b);
                
                if (uniqueTimestamps.length > 0) {
                    let startTs = uniqueTimestamps[0]; 
                    let endTs = uniqueTimestamps[uniqueTimestamps.length - 1];
                    
                    // 區間天數 (最後一天 - 第一天 + 1)
                    let rangeDays = Math.ceil(Math.abs(endTs - startTs) / (1000 * 60 * 60 * 24)) + 1; 
                    // 實際有做天數
                    let workDays = uniqueTimestamps.length;

                    let sD = new Date(startTs); 
                    let eD = new Date(endTs);
                    let startStr = `${sD.getFullYear()}-${(sD.getMonth()+1).toString().padStart(2,'0')}-${sD.getDate().toString().padStart(2,'0')}`;
                    let endStr = `${eD.getFullYear()}-${(eD.getMonth()+1).toString().padStart(2,'0')}-${eD.getDate().toString().padStart(2,'0')}`;
                    
                    selectedStaffData.set(phone, { start: startStr, end: endStr, rangeDays: rangeDays, workDays: workDays });
                    count++;
                }
            }

            msgEl.innerText = `✅ 暴力解析成功！已帶入 ${count} 位人員。`; 
            msgEl.style.color = "var(--success)";
            
            if (missingNames.size > 0) { 
                missingBox.style.display = 'block'; 
                missingBox.innerHTML = `⚠️ <b>抓漏警告：以下名串出現在班表，但系統不認識 (請檢查錯字或新增至資料庫)：</b><br>${Array.from(missingNames).join("、")}`; 
            } else { 
                missingBox.style.display = 'none'; 
            }
            renderSource(); renderTarget();
        }

        // ==========================================
        // UI 渲染與其他功能
        // ==========================================
        function renderSource() {
            const container = document.getElementById('sourceList'); const keyword = document.getElementById('searchInput').value.toLowerCase(); container.innerHTML = "";
            staffList.forEach(staff => {
                if (selectedStaffData.has(staff.phone)) return; 
                if ((staff.name && staff.name.includes(keyword)) || (staff.phone && staff.phone.includes(keyword))) {
                    const div = document.createElement('div'); div.className = 'staff-item';
                    div.onclick = () => { selectedStaffData.set(staff.phone, { start: "", end: "", rangeDays: "", workDays: "" }); renderAll(); };
                    div.innerHTML = `<div class="s-info"><span class="s-name">${staff.name}</span><span class="s-detail">${staff.phone}</span></div><div class="s-action">➜</div>`;
                    container.appendChild(div);
                }
            });
        }

        function renderTarget() {
            const container = document.getElementById('targetList'); const emptyMsg = document.getElementById('emptyMsg'); container.innerHTML = "";
            if (selectedStaffData.size === 0) { if(emptyMsg) emptyMsg.style.display = "block"; container.appendChild(emptyMsg || createEmptyMsg()); } else {
                if(emptyMsg) emptyMsg.style.display = "none";
                selectedStaffData.forEach((val, phone) => {
                    const staff = staffList.find(s => s.phone === phone);
                    if (staff) {
                        const div = document.createElement('div'); div.className = 'staff-item selected-item';
                        div.onclick = () => { selectedStaffData.delete(phone); renderAll(); };
                        let infoHtml = `<span class="s-name">${staff.name}</span>`;
                        if (val.start) { infoHtml += `<div class="date-tag">${val.start.slice(5)} ~ ${val.end.slice(5)} (共${val.rangeDays}天 / 做${val.workDays}天)</div>`; } else { infoHtml += `<span class="s-detail">${staff.phone}</span>`; }
                        div.innerHTML = `<div class="s-info">${infoHtml}</div><div class="s-action" style="color:#FF5252;">✕</div>`;
                        container.appendChild(div);
                    }
                });
            }
            document.getElementById('countBadge').innerText = `${selectedStaffData.size} 人`;
        }

        function createEmptyMsg() { const div = document.createElement('div'); div.id = 'emptyMsg'; div.style.textAlign = 'center'; div.style.color = '#666'; div.style.fontSize = '12px'; div.style.marginTop = '20px'; div.innerText = '請從左側點擊，或使用上方智慧匯入'; return div; }
        function renderAll() { renderSource(); renderTarget(); }
        function clearTarget() { if(confirm("確定要清空名單嗎？")) { selectedStaffData.clear(); renderAll(); document.getElementById('pasteArea').value = ""; document.getElementById('parseMsg').innerText = ""; document.getElementById('missingBox').style.display = 'none'; } }

        // === 📋 功能 1：簡易名單 (根據勾選) ===
        function generateSimpleFormat() {
            if (selectedStaffData.size === 0) { alert("名單是空的！"); return; }
            let text = ""; let index = 1;
            
            const needBday = document.getElementById('opt-bday').checked;
            const needId = document.getElementById('opt-id').checked;
            const needPhone = document.getElementById('opt-phone').checked;
            const needBody = document.getElementById('opt-body').checked;
            const needAddr = document.getElementById('opt-addr').checked;

            selectedStaffData.forEach((data, phone) => {
                const s = staffList.find(st => st.phone === phone);
                if (s) {
                    let parts = [];
                    parts.push(`${index}.${s.name}`);
                    if(needBday) { let bDayStr = formatRocDate(s.birthday, "."); parts.push(bDayStr); }
                    if(needId) parts.push(s.id || "無身分證");
                    if(needPhone) parts.push(s.phone);
                    if(needBody) parts.push(s.bodyInfo || "體型未知");
                    if(needAddr) parts.push(s.address || "");

                    text += parts.join(" / ") + "\n";
                    index++;
                }
            });
            copyToClipboard(text);
        }

        // === 📊 功能 2：舊版 Excel 格式 (對應你的圖四，方便核對) ===
        function generateExcelFormatWithDate() {
            if (selectedStaffData.size === 0) { alert("名單是空的！"); return; }
            
            // 順序：起始日 | 結束日 | 區間天數 | 編號 | 姓名 | 生日 | 身分證
            let text = ""; let index = 1;

            selectedStaffData.forEach((data, phone) => {
                const s = staffList.find(st => st.phone === phone);
                if (s) {
                    let rocBday = formatRocDate(s.birthday, "/");
                    let start = data.start ? data.start.replace(/\//g, '-') : ""; 
                    let end = data.end ? data.end.replace(/\//g, '-') : ""; 
                    let rDays = data.rangeDays || "";
                    
                    text += `${start}\t${end}\t${rDays}\t${index}\t${s.name}\t${rocBday}\t${s.id || ""}\n`;
                    index++;
                }
            });
            copyToClipboard(text);
        }

        // === 🛡️ 功能 3：新版保險格式 (對應你的圖五，上傳保險用) ===
        function generateExcelFormatForInsurance() {
            if (selectedStaffData.size === 0) { alert("名單是空的！"); return; }
            
            // 格式：姓名 | (空) | (空) | 民國年 | 月 | 日 | 身分證 | 手機 | 信箱
            let text = ""; 

            selectedStaffData.forEach((data, phone) => {
                const s = staffList.find(st => st.phone === phone);
                if (s) {
                    let bDayStr = s.birthday || "";
                    let y = "", m = "", d = "";
                    let parts = String(bDayStr).split(/[-/.]/);
                    if (parts.length >= 3) {
                        y = parseInt(parts[0]);
                        if (y > 1911) y -= 1911; 
                        m = parseInt(parts[1]);
                        d = parseInt(parts[2]);
                    }

                    let email = s.email || ""; 
                    let id = s.id || "";

                    text += `${s.name}\t\t\t${y}\t${m}\t${d}\t${id}\t'${s.phone}\t${email}\n`;
                }
            });
            copyToClipboard(text);
        }

        function formatRocDate(dateStr, separator) { if (!dateStr) return "??.??.??"; let parts = String(dateStr).split(/[-/.]/); if (parts.length >= 3) { let y = parseInt(parts[0]); let m = parts[1]; let d = parts[2]; if (y > 1911) y -= 1911; return `${y}${separator}${m}${separator}${d}`; } return dateStr; }
        
        function copyToClipboard(text) { 
            navigator.clipboard.writeText(text).then(() => { 
                alert(`✅ 複製成功！\n\n內容預覽：\n${text.substring(0, 100)}...`); 
            }).catch(err => { 
                alert("❌ 複製失敗，請手動複製"); 
            }); 
        }
    </script>
</body>
</html>
