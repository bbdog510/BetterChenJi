<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>員工資料速撈 & 保險生成</title>
    <link rel="icon" href="img/logo.png" type="image/png">
    <style>
        :root {
            --bg-color: #121212; --text-main: #E0E0E0; --text-sub: #AAAAAA; --card-bg: #1E1E1E;
            --primary: #FFD54F; --border: #333; --highlight: #4285F4;
            --danger: #FF5252; --success: #66BB6A;
        }
        body.light-mode {
            --bg-color: #FDFCF4; --text-main: #1C1B1F; --text-sub: #666666; --card-bg: #FFF;
            --primary: #6F5D00; --border: #E0E0E0; --highlight: #1976D2;
        }
        body {
            font-family: 'MiSans', sans-serif; background: var(--bg-color); color: var(--text-main);
            margin: 0; padding: 15px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;
        }

        h2 { margin: 0 0 10px 0; color: var(--primary); text-align: center; font-size: 1.2rem; }

        /* 頂部智慧解析區 */
        .smart-area {
            background: var(--card-bg); border: 1px dashed var(--highlight); border-radius: 12px;
            padding: 15px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px;
        }
        .smart-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .smart-title { font-weight: bold; color: var(--highlight); display: flex; align-items: center; gap: 5px; }
        .smart-content { display: none; margin-top: 10px; }
        .smart-content.show { display: block; }
        
        textarea {
            width: 100%; height: 80px; background: rgba(0,0,0,0.2); border: 1px solid var(--border);
            color: var(--text-main); border-radius: 8px; padding: 8px; font-size: 12px; resize: none;
        }

        /* 主容器：左右兩欄 */
        .container {
            display: flex; gap: 15px; flex: 1; overflow: hidden;
        }
        @media (max-width: 768px) { .container { flex-direction: column; } }

        /* 區塊樣式 */
        .panel {
            flex: 1; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border);
            display: flex; flex-direction: column; overflow: hidden; padding: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .panel-title { font-weight: bold; color: var(--text-main); font-size: 14px; }
        .count-badge { background: var(--highlight); color: white; padding: 2px 8px; border-radius: 10px; font-size: 12px; }

        .search-box {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
            background: rgba(125,125,125,0.1); color: var(--text-main); margin-bottom: 10px;
            box-sizing: border-box; outline: none;
        }

        .list-area {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
            padding: 5px; border: 2px dashed transparent; transition: 0.2s;
        }
        .list-area.drag-over { border-color: var(--highlight); background: rgba(66, 133, 244, 0.1); border-radius: 8px; }

        /* 員工卡片 */
        .staff-item {
            background: rgba(125,125,125,0.1); padding: 8px 12px; border-radius: 8px;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            border: 1px solid transparent; transition: 0.2s; user-select: none;
        }
        .staff-item:active { transform: scale(0.98); }
        .staff-item:hover { border-color: var(--primary); background: rgba(255, 213, 79, 0.1); }
        
        .s-info { display: flex; flex-direction: column; }
        .s-name { font-weight: bold; font-size: 15px; }
        .s-detail { font-size: 11px; color: var(--text-sub); display: flex; gap: 5px; }
        .s-action { font-size: 16px; color: var(--text-sub); }

        /* 右邊選中區的樣式差異 - 加入時間資訊 */
        .selected-item { border-left: 4px solid var(--highlight); background: rgba(66, 133, 244, 0.1); }
        .date-tag { font-size: 10px; color: var(--highlight); background: rgba(66, 133, 244, 0.2); padding: 2px 5px; border-radius: 4px; margin-top: 2px;}

        .bottom-bar { margin-top: 15px; display: flex; gap: 10px; }
        .btn {
            flex: 1; padding: 12px; border: none; border-radius: 50px;
            font-weight: bold; cursor: pointer; font-size: 15px;
            display: flex; justify-content: center; align-items: center; gap: 5px;
        }
        .btn-gen { background: var(--primary); color: #000; flex: 2; }
        .btn-parse { background: var(--success); color: #fff; width: 100%; margin-top: 5px; padding: 8px; border-radius: 8px; font-size: 14px;}
        .btn-clear { background: #444; color: #fff; flex: 0.5; }
        .btn-back { background: transparent; border: 1px solid var(--text-sub); color: var(--text-sub); flex: 0.4; text-decoration: none;}

    </style>
</head>
<body>

    <h2>⚡ 員工資料速撈 & 保險生成</h2>

    <div class="smart-area">
        <div class="smart-header" onclick="toggleSmart()">
            <div class="smart-title">🤖 班表智慧匯入 (點我展開)</div>
            <div style="font-size: 12px; color: var(--text-sub);">支援 Excel / Google Sheet 貼上</div>
        </div>
        <div class="smart-content" id="smartContent">
            <textarea id="pasteArea" placeholder="請直接從 Google Sheet 全選班表區域 (包含日期列)，然後貼上到這裡..."></textarea>
            <div style="display:flex; gap:10px; margin-top:5px;">
                <input type="number" id="parseYear" value="2026" style="width:60px; padding:5px; border-radius:5px; border:1px solid #555; background:#333; color:#fff;" placeholder="年份">
                <button class="btn btn-parse" onclick="parseSchedule()">🔍 分析班表並帶入</button>
            </div>
            <div id="parseMsg" style="font-size:12px; color:var(--text-sub); margin-top:5px;"></div>
        </div>
    </div>

    <div class="container">
        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">👥 人員庫</span>
            </div>
            <input type="text" id="searchInput" class="search-box" placeholder="搜尋姓名、電話..." oninput="renderSource()">
            <div id="sourceList" class="list-area"></div>
        </div>

        <div class="panel" style="border-color: var(--highlight);">
            <div class="panel-header">
                <span class="panel-title" style="color:var(--highlight);">📋 投保名單</span>
                <span id="countBadge" class="count-badge">0 人</span>
            </div>
            <div id="targetList" class="list-area">
                <div style="text-align:center; color:#666; font-size:12px; margin-top:20px;" id="emptyMsg">
                    請從左側點擊加入，或使用上方智慧匯入
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-bar">
        <a href="dashboard.html" class="btn btn-back">⬅️</a>
        <button class="btn btn-clear" onclick="clearTarget()">🗑️ 清空</button>
        <button class="btn btn-gen" onclick="generateExcelFormat()">📋 複製為 Excel 表格格式</button>
    </div>

    <script>
        if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');

        const cachedDB = localStorage.getItem('STAFF_DB_CACHE');
        if (!cachedDB) { alert('請先登入以同步資料'); window.location.href = 'index.html'; }
        
        const STAFF_DB = JSON.parse(cachedDB);
        let staffList = Object.values(STAFF_DB);
        staffList.sort((a, b) => new Date(b.entryDate || 0) - new Date(a.entryDate || 0));

        // 核心資料結構：使用 Map 來紀錄選中的人，Key是電話，Value是 { start, end, days }
        let selectedStaffData = new Map(); 

        renderSource();
        renderTarget();

        function toggleSmart() {
            document.getElementById('smartContent').classList.toggle('show');
        }

        // === 🤖 智慧解析核心邏輯 ===
        function parseSchedule() {
            const text = document.getElementById('pasteArea').value;
            const year = document.getElementById('parseYear').value || new Date().getFullYear();
            const msgEl = document.getElementById('parseMsg');
            
            if (!text.trim()) { msgEl.innerText = "❌ 請先貼上資料"; return; }

            // 1. 拆解 Excel 貼上的文字 (Tab 分隔)
            const rows = text.split('\n').map(row => row.split('\t'));
            
            // 2. 找出日期所在的 Column (欄位)
            // 邏輯：掃描所有格子，找出符合 MM/DD 格式的
            let dateMap = {}; // colIndex -> "MM/DD"
            let foundDateRow = false;

            // 先掃前 5 行找日期頭
            for(let r=0; r<Math.min(rows.length, 10); r++) {
                rows[r].forEach((cell, cIdx) => {
                    let match = cell.match(/(\d{1,2})\/(\d{1,2})/);
                    if (match) {
                        // 格式化為完整日期字串 YYYY/MM/DD
                        dateMap[cIdx] = `${year}/${match[1].padStart(2,'0')}/${match[2].padStart(2,'0')}`;
                        foundDateRow = true;
                    }
                });
                if(foundDateRow && Object.keys(dateMap).length > 2) break; // 找到足夠多的日期就停止掃描 Header
            }

            if (!foundDateRow) {
                msgEl.innerText = "⚠️ 找不到日期格式 (如 2/10)，請確認複製範圍包含日期列。";
                return;
            }

            // 3. 掃描名字並統計
            let tempResults = {}; // phone -> { dates: Set }

            rows.forEach(row => {
                row.forEach((cell, cIdx) => {
                    let name = cell.trim();
                    if (!name || name.length < 2) return;
                    
                    // 嘗試比對名字 (比對 姓名 或 暱稱)
                    let staff = staffList.find(s => s.name === name || (s.alias && s.alias === name));
                    
                    // 如果這格有名字，且這一欄對應一個有效日期
                    if (staff && dateMap[cIdx]) {
                        if (!tempResults[staff.phone]) {
                            tempResults[staff.phone] = { 
                                name: staff.name, 
                                phone: staff.phone,
                                dates: new Set() 
                            };
                        }
                        tempResults[staff.phone].dates.add(dateMap[cIdx]);
                    }
                });
            });

            // 4. 更新到選取清單
            let count = 0;
            for (let phone in tempResults) {
                let data = tempResults[phone];
                let sortedDates = Array.from(data.dates).sort();
                
                // 計算起訖與天數
                if (sortedDates.length > 0) {
                    let start = sortedDates[0];
                    let end = sortedDates[sortedDates.length - 1];
                    let days = sortedDates.length;

                    selectedStaffData.set(phone, { start, end, days });
                    count++;
                }
            }

            msgEl.innerText = `✅ 成功解析！已帶入 ${count} 位人員的排班資訊。`;
            msgEl.style.color = "var(--success)";
            renderSource();
            renderTarget();
        }

        // === 渲染 UI ===
        function renderSource() {
            const container = document.getElementById('sourceList');
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            container.innerHTML = "";

            staffList.forEach(staff => {
                if (selectedStaffData.has(staff.phone)) return; // 已選就不顯示

                if ((staff.name && staff.name.includes(keyword)) || (staff.phone && staff.phone.includes(keyword))) {
                    const div = document.createElement('div');
                    div.className = 'staff-item';
                    div.onclick = () => { selectedStaffData.set(staff.phone, { start: "", end: "", days: "" }); renderAll(); };
                    div.innerHTML = `
                        <div class="s-info">
                            <span class="s-name">${staff.name}</span>
                            <span class="s-detail">${staff.phone}</span>
                        </div>
                        <div class="s-action">➜</div>
                    `;
                    container.appendChild(div);
                }
            });
        }

        function renderTarget() {
            const container = document.getElementById('targetList');
            const emptyMsg = document.getElementById('emptyMsg');
            container.innerHTML = "";

            if (selectedStaffData.size === 0) {
                if(emptyMsg) emptyMsg.style.display = "block";
                container.appendChild(emptyMsg || createEmptyMsg());
            } else {
                if(emptyMsg) emptyMsg.style.display = "none";
                selectedStaffData.forEach((val, phone) => {
                    const staff = staffList.find(s => s.phone === phone);
                    if (staff) {
                        const div = document.createElement('div');
                        div.className = 'staff-item selected-item';
                        div.onclick = () => { selectedStaffData.delete(phone); renderAll(); };
                        
                        let infoHtml = `<span class="s-name">${staff.name}</span>`;
                        // 如果有智慧解析的時間資料，顯示出來
                        if (val.start) {
                            infoHtml += `<div class="date-tag">${val.start.slice(5)} ~ ${val.end.slice(5)} (共${val.days}天)</div>`;
                        } else {
                            infoHtml += `<span class="s-detail">${staff.phone}</span>`;
                        }

                        div.innerHTML = `
                            <div class="s-info">${infoHtml}</div>
                            <div class="s-action" style="color:#FF5252;">✕</div>
                        `;
                        container.appendChild(div);
                    }
                });
            }
            document.getElementById('countBadge').innerText = `${selectedStaffData.size} 人`;
        }

        function createEmptyMsg() {
            const div = document.createElement('div');
            div.id = 'emptyMsg';
            div.style.textAlign = 'center'; div.style.color = '#666'; div.style.fontSize = '12px'; div.style.marginTop = '20px';
            div.innerText = '請從左側點擊，或使用上方智慧匯入';
            return div;
        }

        function renderAll() {
            renderSource();
            renderTarget();
        }

        function clearTarget() {
            if(confirm("確定要清空名單嗎？")) {
                selectedStaffData.clear();
                renderAll();
                document.getElementById('pasteArea').value = ""; // 清空貼上區
                document.getElementById('parseMsg').innerText = "";
            }
        }

        // === 🔥 生成 Excel 格式 (Tab 分隔) ===
        function generateExcelFormat() {
            if (selectedStaffData.size === 0) { alert("名單是空的！"); return; }

            // 表頭：開始日, 結束日, 天數, 編號, 姓名, 生日, 身分證, 代理人...
            let text = "";

            selectedStaffData.forEach((data, phone) => {
                const s = staffList.find(st => st.phone === phone);
                if (s) {
                    // 處理生日 (轉民國年)
                    let bDayStr = s.birthday || "";
                    let rocBday = "";
                    
                    let parts = bDayStr.split(/[-/.]/); 
                    if (parts.length >= 3) {
                        let y = parseInt(parts[0]);
                        let m = parts[1];
                        let d = parts[2];
                        if (y > 1911) y -= 1911; 
                        rocBday = `${y}/${m}/${d}`; // Excel 喜歡斜線
                    } else {
                        rocBday = bDayStr; 
                    }

                    // 組合字串 (使用 \t 分隔，這樣貼到 Excel 會自動分欄)
                    // 順序參考你的圖四：開始日 | 結束日 | 天數 | (空) | 姓名 | 生日 | 身分證 | (空) | (空) | 電話
                    
                    let start = data.start ? data.start.replace(/\//g, '-') : "";
                    let end = data.end ? data.end.replace(/\//g, '-') : "";
                    let days = data.days || "";

                    // Excel 格式行
                    text += `${start}\t${end}\t${days}\t\t${s.name}\t${rocBday}\t${s.id || ""}\t\t\t${s.phone}\n`;
                }
            });

            navigator.clipboard.writeText(text).then(() => {
                alert(`✅ 已複製 ${selectedStaffData.size} 筆資料！\n\n您可以直接貼上到 Google Sheet / Excel 的表格中。`);
            }).catch(err => {
                alert("❌ 複製失敗");
            });
        }

    </script>
</body>
</html>
