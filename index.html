<html lang="zh-TW">
<head>

    <title>陳記元宵登入</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link rel="icon" href="img/logo.png" type="image/png">
    
    <style>
        :root {
            --bg-color: #121212; --card-bg: #1E1E1E; --text-main: #E0E0E0;
            --text-sub: #A0A0A0; --input-bg: #2C2C2C; --input-border: #444;
            --primary: #FFD54F; --btn-text: #000;
        }
        body.light-mode {
            --bg-color: #FDFCF4; --card-bg: #FFFFFF; --text-main: #333333;
            --text-sub: #666666; --input-bg: #F4F6F4; --input-border: #E0E2E0;
            --primary: #6F5D00; --btn-text: #FFFFFF;
        }
        body {
            font-family: 'MiSans', sans-serif; background-color: var(--bg-color);
            color: var(--text-main); display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; margin: 0; 
            transition: 0.3s;
        }
        .login-card {
            background: var(--card-bg); padding: 40px 30px; border-radius: 28px;
            width: 85%; max-width: 320px; text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
        }
        .logo { width: 80px; height: 80px; border-radius: 20px; margin-bottom: 20px; }
        h1 { font-size: 24px; margin-bottom: 5px; }
        p { color: var(--text-sub); font-size: 14px; margin-bottom: 30px; }

        .input-group { text-align: left; margin-bottom: 15px; display: flex; flex-direction: column; align-items: center; }
        label { font-size: 12px; color: var(--text-sub); width: 100%; max-width: 280px; margin-bottom: 5px; text-align: left; }
        
        input {
            width: 100%; max-width: 280px;
            padding: 16px; border: 2px solid var(--input-border);
            border-radius: 16px; background: var(--input-bg); color: var(--text-main);
            outline: none; transition: 0.3s; box-sizing: border-box;
        }
        input:focus { border-color: var(--primary); }
