<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>陳記元宵戰情室</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e67e22">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3063/3063822.png"> 
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; padding-bottom: 80px;}
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { text-align: center; color: #d35400; margin-top: 0; }
        
        /* 時鐘 */
        .clock-box { background: #2c3e50; color: #2ecc71; padding: 15px; border-radius: 8px; text-align: center; font-family: monospace; font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; }

        /* 輸入區與按鈕 */
        textarea { width: 100%; height: 120px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; margin-bottom: 10px; box-sizing: border-box; }
        
        /* 按鈕群組 */
        .btn-group { display: flex; gap: 10px; margin-bottom: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        
        .btn-paste { background: #95a5a6; color: white; flex: 0 0 30%; } 
        .btn-gen { background: #e67e22; color: white; flex: 1; }
        .btn-copy { background: #27ae60; color: white; width: 100%; }
        
        button:active { transform: scale(0.98); opacity: 0.9; }

        /* 結果區 */
        #result { background: #fafafa; border: 2px dashed #ccc; }

        /* 圖片下載區 */
        .img-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .img-item {
            position: relative;
            background: #eee;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 1 / 1; 
            cursor: pointer;
            border: 2px solid transparent;
            text-decoration: none; /* 移除超連結底線 */
        }
        .img-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .img-item:active { border-color: #e67e22; }
        .download-hint {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 10px;
            text-align: center;
            padding: 2px;
        }

        .footer { text-align: center; font-size: 12px; color: #aaa; margin-top: 30px; }
    </style>
</head>
<body>

    <div class="clock-box">
        <div id="clock">Loading...</div>
    </div>

    <div class="card">
        <h2>🏮 文案產生器</h2>
        
        <p style="font-size:14px; color:#666; margin-bottom:5px;">1. 貼上原始班表：</p>
        <div class="btn-group">
            <button class="btn-paste" onclick="pasteText()">📋 貼上</button>
            <button class="btn-gen" onclick="generatePost()">✨ 產生文案</button>
        </div>
        <textarea id="rawInput" placeholder="直接按「貼上」按鈕，或在此輸入..."></textarea>
        
        <hr style="border:0; border-top:1px solid #eee; margin:20px 0;">
        
        <p style="font-size:14px; color:#666; margin-bottom:5px;">2. 生成結果：</p>
        <textarea id="result" readonly></textarea>
        <button class="btn-copy" onclick="copyResult()">📋 複製文案</button>
    </div>

    <div class="card">
        <h2>📸 發文配圖區</h2>
        <p style="text-align:center; font-size:12px; color:#999; margin-bottom:15px;">點擊圖片即可下載原圖</p>
        
        <div class="img-grid">
            <a href="img/1.jpg" download="元宵宣傳圖1.jpg" class="img-item">
                <img src="img/1.jpg" alt="圖1">
                <div class="download-hint">點擊下載</div>
            </a>
            <a href="img/2.jpg" download="元宵宣傳圖2.jpg" class="img-item">
                <img src="img/2.jpg" alt="圖2">
                <div class="download-hint">點擊下載</div>
            </a>
            <a href="img/3.jpg" download="元宵宣傳圖3.jpg" class="img-item">
                <img src="img/3.jpg" alt="圖3">
                <div class="download-hint">點擊下載</div>
            </a>
        </div>
    </div>

    <div class="footer">
        陳記元宵系統 v2.1 | <span onclick="adminCheck()">⚙️</span>
    </div>

    <script>
        // Service Worker
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }

        // 資料庫
        const storeDB = {
            "Br4": { name: "City’Super 復興SOGO店", addr: "106台北市大安區忠孝東路三段300號遠東SOGO台北復興館B3", region: "📍台北 Taipei📍" },
            "美福": { name: "美福食集", addr: "114 台北市內湖區民善街 128 號 1F", region: "📍台北 Taipei📍" },
            "美麗華": { name: "美麗華", addr: "114 台北市中山區敬業三路 22 號 B1", region: "📍台北 Taipei📍" },
            "天母": { name: "City’Super 天母SOGO店", addr: "111 台北市士林區中山北路六段 77 號 B1", region: "📍台北 Taipei📍" },
            "統一": { name: "統一時代百貨台北店", addr: "110 台北市信義區忠孝東路五段 8 號 B2", region: "📍台北 Taipei📍" },
            "松山": { name: "松山車站", addr: "105 台北市松山區松山路 11 號 1F", region: "📍台北 Taipei📍" },
            "微風": { name: "微風超市", addr: "105 台北市松山區復興南路一段 39 號 B4", region: "📍台北 Taipei📍" },
            "大葉": { name: "大葉高島屋", addr: "111 台北市士林區忠誠路二段 55 號 B1", region: "📍台北 Taipei📍" },
            "宏匯廣場": { name: "宏匯廣場", addr: "242 新北市新莊區新北大道四段3號 B2", region: "📍台北 Taipei📍" },
            "中和環球": { name: "中和環球", addr: "235 新北市中和區中山路三段122號 B2", region: "📍台北 Taipei📍" },
            "新竹": { name: "新竹巨城 Big City", addr: "300 新竹市東區中央路 229 號 B1", region: "📍新竹 Hsinchu📍" },
            "竹北": { name: "竹北大遠百", addr: "302 新竹縣竹北市莊敬北路18號", region: "📍新竹 Hsinchu📍" },
            "台中": { name: "台中大遠百 Top City", addr: "407 台中市西屯區台灣大道三段 251 號 B2", region: "📍台中 Taichung📍" },
            "大樂": { name: "大樂購物中心", addr: "807 高雄市三民區民族一路 463 號", region: "📍高雄 Kaohsiung📍" },
            "巨蛋": { name: "漢神巨蛋購物廣場", addr: "813 高雄市左營區博愛二路777號 B1", region: "📍高雄 Kaohsiung📍" }
        };

        // 時鐘
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleString('zh-TW', { hour12: false });
        }
        setInterval(updateClock, 1000); updateClock();

        // 貼上功能
        async function pasteText() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('rawInput').value = text;
            } catch (err) {
                alert('請手動貼上');
            }
        }

        // 產生文案 (核心邏輯修改處)
        function generatePost() {
            const raw = document.getElementById('rawInput').value;
            const lines = raw.split('\n');
            const year = 2026;
            let data = {};

            lines.forEach(line => {
                line = line.trim();
                let match = line.match(/^(.+?)[\s]*(\d{1,2}\/\d{1,2})-(\d{1,2}\/\d{1,2})/);
                if (match) {
                    let key = match[1].trim();
                    let start = match[2];
                    let end = match[3];
                    let info = storeDB[key] || { name: key, addr: "地址待補", region: "📍其他📍" };
                    
                    if (!data[info.region]) data[info.region] = [];
                    
                    let displayTime = `${year}/${start}（${getW(year, start)}）- ${year}/${end}（${getW(year, end)}）`;

                    data[info.region].push({
                        name: info.name,
                        time: displayTime,
                        addr: info.addr,
                        sortKey: parseD(year, start)
                    });
                }
            });

            let out = `元宵開賣啦～我們要相見啦～\n以下為${year}元宵實演的檔期^_^\n歡迎來找我們歐\n\n`;
            const order = ["📍台北 Taipei📍", "📍新竹 Hsinchu📍", "📍台中 Taichung📍", "📍高雄 Kaohsiung📍", "📍其他📍"];

            order.forEach(r => {
                if (data[r]) {
                    out += `${r}\n`;
                    // 取得該區所有店鋪並排序
                    let stores = data[r].sort((a,b) => a.sortKey - b.sortKey);
                    
                    // === 這裡就是判斷邏輯 ===
                    // 如果該區超過 1 家店，就顯示編號，否則不顯示
                    let showNumbering = stores.length > 1;

                    stores.forEach((item, i) => {
                        let prefix = showNumbering ? `${i+1}.` : ""; // 條件式編號
                        out += `${prefix}${item.name}\n時間：${item.time}\n地址：${item.addr}\n\n`;
                    });
                }
            });
            document.getElementById('result').value = out;
        }

        function getW(y, d) { return ['日','一','二','三','四','五','六'][new Date(y, d.split('/')[0]-1, d.split('/')[1]).getDay()]; }
        function parseD(y, d) { return new Date(y, d.split('/')[0]-1, d.split('/')[1]); }
        function copyResult() { 
            let t = document.getElementById("result"); t.select(); document.execCommand("copy"); alert("複製成功！"); 
        }
        function adminCheck() { if(prompt("密碼")=="888") alert("歡迎老闆！"); }
    </script>
</body>
</html>
