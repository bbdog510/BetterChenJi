<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>陳記元宵登入</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fdfcf4">
    <link rel="icon" href="img/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="img/logo.png">
    
    <style>
        :root {
            --primary: #6F5D00;
            --background: #FDFCF4;
        }

        /* 字體設定 */
        body {
            font-family: 'MiSans', 'Xiaomi Lan Ting Pro', 'Google Sans', Roboto, sans-serif;
            background-color: var(--background);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; color: #484649;
        }

        .login-card {
            background: #fff;
            padding: 40px 30px;
            border-radius: 28px;
            width: 80%; max-width: 320px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .logo { width: 80px; height: 80px; border-radius: 20px; margin-bottom: 20px; }
        h1 { font-size: 24px; margin-bottom: 5px; color: #1C1B1F; }
        p { color: #666; font-size: 14px; margin-bottom: 30px; }

        .input-group { text-align: left; margin-bottom: 15px; }
        label { font-size: 12px; color: #666; margin-left: 10px; display: block; margin-bottom: 5px; }
        input {
            width: 100%; padding: 16px;
            border: 2px solid #E0E2E0; border-radius: 16px;
            font-size: 16px; box-sizing: border-box; outline: none;
            background: #F4F6F4; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); background: #fff; }

        .btn-main {
            width: 100%; padding: 16px; margin-top: 10px;
            background-color: var(--primary); color: white;
            border: none; border-radius: 100px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-main:active { transform: scale(0.98); opacity: 0.9; }

        #install-btn {
            display: none; margin-top: 20px;
            color: var(--primary); background: #FFE16D;
            padding: 10px 20px; border-radius: 100px;
            font-size: 13px; font-weight: bold; cursor: pointer; border: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="img/logo.png" class="logo">
        <h1>陳記元宵</h1>
        <p>數位戰情中心</p>
        
        <div class="input-group">
            <label>手機號碼 (帳號)</label>
            <input type="tel" id="account" placeholder="09xxxxxxxx" maxlength="10">
        </div>
        
        <div class="input-group">
            <label>生日 (密碼)</label>
            <input type="password" id="pwd" placeholder="例如：831222" maxlength="6">
        </div>

        <button class="btn-main" onclick="login()">登入系統</button>
        <button id="install-btn">📲 點我安裝於桌面</button>
    </div>

    <script src="staffData.js"></script>

    <script>
        // 1. 自動登入檢查
        // 如果 localStorage 裡已經有紀錄手機號碼，直接跳轉到主控台
        if (localStorage.getItem('loginPhone')) {
            window.location.href = 'dashboard.html';
        }

        // 2. 登入邏輯
        function login() {
            const acc = document.getElementById('account').value;
            const pwd = document.getElementById('pwd').value;
            
            // 檢查 staffData.js 裡面有沒有這個「全域變數」
            if (typeof STAFF_DB === 'undefined') {
                alert("系統錯誤：找不到資料庫檔案 (staffData.js)，請檢查檔案是否已建立。");
                return;
            }

            // 檢查資料庫有沒有這個帳號
            if (STAFF_DB[acc]) {
                // 檢查密碼是否正確
                if (STAFF_DB[acc].pwd === pwd) {
                    // 登入成功！
                    localStorage.setItem('loginPhone', acc); // 記住是誰登入的
                    window.location.href = 'dashboard.html'; // 跳轉頁面
                } else {
                    alert("密碼錯誤 (請輸入生日 6 碼)");
                }
            } else {
                alert("找不到此帳號，請確認是否已填寫員工登錄表單");
            }
        }

        // 3. PWA 安裝按鈕邏輯
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'inline-block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                installBtn.style.display = 'none';
            }
        });
    </script>
</body>
</html>
