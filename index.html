<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>陳記元宵登入</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fdfcf4">
    <link rel="icon" href="img/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="img/logo.png">
    
    <style>
        /* Android 16 風格基礎色調 */
        :root {
            --md-sys-color-primary: #6F5D00;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #FFE16D;
            --md-sys-color-background: #FDFCF4;
            --md-sys-color-surface: #FDFCF4;
        }

        body {
            font-family: 'Google Sans', Roboto, sans-serif;
            background-color: var(--md-sys-color-background);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; color: #484649;
        }

        .login-card {
            background: #fff;
            padding: 40px 30px;
            border-radius: 28px; /* Android 大圓角 */
            width: 80%; max-width: 320px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .logo { width: 80px; height: 80px; border-radius: 20px; margin-bottom: 20px; }
        h1 { font-size: 24px; margin-bottom: 10px; color: #1C1B1F; }
        p { color: #666; font-size: 14px; margin-bottom: 30px; }

        input {
            width: 100%; padding: 16px; margin-bottom: 20px;
            border: 2px solid #E0E2E0; border-radius: 16px;
            font-size: 16px; box-sizing: border-box; outline: none;
            background: #F4F6F4; transition: 0.3s;
        }
        input:focus { border-color: var(--md-sys-color-primary); background: #fff; }

        .btn-main {
            width: 100%; padding: 16px;
            background-color: var(--md-sys-color-primary); color: white;
            border: none; border-radius: 100px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-main:active { transform: scale(0.98); opacity: 0.9; }

        /* 安裝按鈕 (預設隱藏，支援 PWA 才會出現) */
        #install-btn {
            display: none; margin-top: 20px;
            color: var(--md-sys-color-primary);
            background: var(--md-sys-color-primary-container);
            padding: 10px 20px; border-radius: 100px;
            font-size: 13px; font-weight: bold; cursor: pointer; border: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="img/logo.png" class="logo">
        <h1>陳記元宵</h1>
        <p>數位戰情中心</p>
        
        <input type="password" id="pwd" placeholder="請輸入訪問密碼">
        <button class="btn-main" onclick="login()">登入系統</button>
        
        <button id="install-btn">📲 點我安裝於桌面</button>
    </div>

    <script>
        // 1. 自動登入檢查
        // 如果瀏覽器記得你登入過，直接送去主控台
        if (localStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = 'dashboard.html';
        }

        // 2. 登入邏輯
        function login() {
            const pwd = document.getElementById('pwd').value;
            // 這裡設定你的密碼，目前是 888
            if (pwd === "888") {
                localStorage.setItem('isLoggedIn', 'true'); // 記住登入狀態
                window.location.href = 'dashboard.html';
            } else {
                alert("密碼錯誤！");
            }
        }

        // 3. PWA 安裝按鈕邏輯
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'inline-block'; // 顯示按鈕
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                installBtn.style.display = 'none';
            }
        });
    </script>
</body>
</html>
