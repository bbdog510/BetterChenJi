<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>陳記元宵登入</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link rel="icon" href="img/logo.png" type="image/png">
    
    <style>
        :root {
            --bg-color: #121212; --card-bg: #1E1E1E; --text-main: #E0E0E0;
            --text-sub: #A0A0A0; --input-bg: #2C2C2C; --input-border: #444;
            --primary: #FFD54F; --btn-text: #000;
        }
        body.light-mode {
            --bg-color: #FDFCF4; --card-bg: #FFFFFF; --text-main: #333333;
            --text-sub: #666666; --input-bg: #F4F6F4; --input-border: #E0E2E0;
            --primary: #6F5D00; --btn-text: #FFFFFF;
        }
        body {
            font-family: 'MiSans', sans-serif; background-color: var(--bg-color);
            color: var(--text-main); display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; margin: 0; 
            transition: 0.3s;
        }
        .login-card {
            background: var(--card-bg); padding: 40px 30px; border-radius: 28px;
            width: 85%; max-width: 320px; text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
        }
        .logo { width: 80px; height: 80px; border-radius: 20px; margin-bottom: 20px; }
        h1 { font-size: 24px; margin-bottom: 5px; }
        p { color: var(--text-sub); font-size: 14px; margin-bottom: 30px; }

        .input-group { text-align: left; margin-bottom: 15px; display: flex; flex-direction: column; align-items: center; }
        label { font-size: 12px; color: var(--text-sub); width: 100%; max-width: 280px; margin-bottom: 5px; text-align: left; }
        
        input {
            width: 100%; max-width: 280px;
            padding: 16px; border: 2px solid var(--input-border);
            border-radius: 16px; background: var(--input-bg); color: var(--text-main);
            outline: none; transition: 0.3s; box-sizing: border-box;
        }
        input:focus { border-color: var(--primary); }

        .btn-main {
            width: 100%; max-width: 280px; padding: 16px; margin-top: 10px;
            background-color: var(--primary); color: var(--btn-text);
            border: none; border-radius: 100px; font-weight: bold; cursor: pointer;
        }
        .btn-main:disabled { background-color: #555; color: #888; cursor: not-allowed; }

        /* 時間顯示樣式 */
        #status-msg { font-size: 12px; color: var(--text-sub); margin-top: 25px; opacity: 0.8; letter-spacing: 0.5px; }
        
        #install-btn {
            display: none; margin-top: 15px;
            background: rgba(255, 255, 255, 0.1); color: var(--primary);
            padding: 8px 16px; border-radius: 20px; font-size: 12px; 
            cursor: pointer; border: 1px solid var(--primary);
        }

        .theme-toggle {
            position: fixed; bottom: 20px;
            background: rgba(255,255,255,0.1); color: var(--text-sub);
            padding: 8px 16px; border-radius: 20px; font-size: 12px; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="img/logo.png" class="logo">
        <h1>陳記元宵</h1>
        <p>數位戰情中心</p>
        
        <div class="input-group">
            <label>手機號碼</label>
            <input type="tel" id="account" placeholder="09xxxxxxxx" maxlength="10">
        </div>
        <div class="input-group">
            <label>密碼 (生日)</label>
            <input type="password" id="pwd" placeholder="例如：870101" maxlength="6">
        </div>

        <button id="loginBtn" class="btn-main" onclick="login()" disabled>連線中...</button>
        <button id="install-btn">📲 點我安裝於桌面</button>
        
        <div id="status-msg">正在同步最新名單...</div>
    </div>

    <div class="theme-toggle" onclick="toggleTheme()">🌙 / ☀️ 切換</div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        }
        if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');

        // === 這裡換上了你指定的新網址 ===
        const API_URL = "https://script.google.com/macros/s/AKfycbzPfPlR6XPiUD6nqVMxhLRcikiQ0gNJhKTftgRyuSGuAHaf3kbA-Rs6LXQSwyEM10GB2w/exec"; 
        
        let STAFF_DB = {};
        const cachedData = localStorage.getItem('STAFF_DB_CACHE');
        if (cachedData) {
            STAFF_DB = JSON.parse(cachedData);
            enableLogin("已載入快取資料");
        }

        fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                STAFF_DB = data;
                localStorage.setItem('STAFF_DB_CACHE', JSON.stringify(data));
                
                // === 修改時間格式為：YYYY年MM月DD日 HH:mm ===
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const hour = String(now.getHours()).padStart(2, '0');
                const minute = String(now.getMinutes()).padStart(2, '0');
                
                // 組合字串
                const timeStr = `${year}年${month}月${day}日 ${hour}:${minute}`;
                              
                enableLogin(`最後更新：${timeStr} ✅`);
                
                const savedPhone = localStorage.getItem('loginPhone');
                if (savedPhone && STAFF_DB[savedPhone]) window.location.replace('dashboard.html');
            })
            .catch(err => {
                if(!cachedData) {
                    document.getElementById('status-msg').innerText = "連線失敗 ❌";
                    document.getElementById('status-msg').style.color = "#FF5252";
                }
            });

        function enableLogin(text) {
            const btn = document.getElementById('loginBtn');
            btn.disabled = false;
            btn.innerText = "登入系統";
            document.getElementById('status-msg').innerText = text;
        }

        function login() {
            const acc = document.getElementById('account').value;
            const pwd = document.getElementById('pwd').value;

            if (acc === "0936588349" && pwd === "831222") {
                 localStorage.setItem('loginPhone', acc);
                 if(!STAFF_DB[acc]) STAFF_DB[acc] = { name: "NICK", role: "ADMIN", origin: "管理員" };
                 else STAFF_DB[acc].role = "ADMIN"; 
                 localStorage.setItem('STAFF_DB_CACHE', JSON.stringify(STAFF_DB));
                 window.location.replace('dashboard.html');
                 return;
            }

            if (STAFF_DB[acc] && String(STAFF_DB[acc].pwd) === String(pwd)) {
                localStorage.setItem('loginPhone', acc);
                window.location.replace('dashboard.html');
            } else {
                alert("帳號或密碼錯誤");
            }
        }

        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'inline-block';
        });
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt = null;
                installBtn.style.display = 'none';
            }
        });
    </script>
</body>
</html>
