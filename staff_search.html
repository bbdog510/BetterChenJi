<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>員工資料庫</title>
    <link rel="icon" href="img/logo.png" type="image/png">
    <style>
        :root { --bg-color: #121212; --text-main: #E0E0E0; --text-sub: #AAAAAA; --card-bg: #1E1E1E; --primary: #CE93D8; --border: #333; }
        body.light-mode { --bg-color: #FDFCF4; --text-main: #1C1B1F; --text-sub: #666666; --card-bg: #FFF; --primary: #6200EE; --border: #E0E0E0; }
        body { font-family: 'MiSans', sans-serif; background: var(--bg-color); color: var(--text-main); padding: 20px; margin: 0; padding-bottom: 80px; }
        
        .search-box { position: sticky; top: 0; background: var(--bg-color); padding: 10px 0; z-index: 10; display: flex; gap: 10px; border-bottom: 1px solid var(--border); }
        input { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-main); outline: none; font-size: 16px; }
        
        /* 頁籤切換 */
        .tabs { display: flex; gap: 10px; margin-top: 15px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { background: var(--card-bg); color: var(--text-sub); border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-size: 14px; }
        .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        
        /* 內容區塊 */
        .section { display: none; margin-top: 20px; }
        .section.active { display: block; }

        /* 列表樣式 */
        .staff-card { background: var(--card-bg); padding: 15px; border-radius: 16px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px; cursor: pointer; border: 1px solid transparent; }
        .staff-card:active { transform: scale(0.98); background: rgba(255,255,255,0.05); }
        .avatar-small { width: 50px; height: 50px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 18px; object-fit: cover; flex-shrink: 0; }
        .info { flex: 1; }
        .name { font-size: 18px; font-weight: bold; }
        .sub-info { font-size: 12px; color: var(--text-sub); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 8px; }
        .tag { background: rgba(125,125,125,0.1); padding: 2px 6px; border-radius: 4px; }

        /* 分析圖表樣式 */
        .chart-card { background: var(--card-bg); padding: 20px; border-radius: 16px; margin-bottom: 15px; }
        .chart-title { font-weight: bold; margin-bottom: 15px; color: var(--primary); }
        .bar-row { display: flex; align-items: center; margin-bottom: 8px; font-size: 12px; }
        .bar-label { width: 80px; text-align: right; margin-right: 10px; color: var(--text-sub); }
        .bar-bg { flex: 1; background: rgba(125,125,125,0.1); height: 10px; border-radius: 5px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--primary); border-radius: 5px; }
        .bar-val { width: 30px; margin-left: 10px; color: var(--text-main); }

        /* 壽星日曆 */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--card-bg); padding: 15px; border-radius: 16px; }
        .cal-btn { background: none; border: none; font-size: 20px; color: var(--primary); cursor: pointer; }
        .cal-month { font-size: 18px; font-weight: bold; }
        .birthday-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
        .b-card { background: var(--card-bg); padding: 10px; border-radius: 12px; text-align: center; border: 1px solid var(--border); }
        .b-date { font-size: 12px; color: var(--primary); font-weight: bold; margin-bottom: 5px; }
        .b-name { font-size: 14px; }

        /* 算命區 */
        .fate-group { margin-bottom: 20px; }
        .fate-num { display: inline-block; width: 30px; height: 30px; background: var(--primary); color: white; border-radius: 50%; text-align: center; line-height: 30px; font-weight: bold; margin-bottom: 10px; }
        .fate-desc { font-size: 12px; color: var(--text-sub); margin-bottom: 10px; }
        .fate-list { display: flex; flex-wrap: wrap; gap: 5px; }
        .fate-person { background: var(--card-bg); border: 1px solid var(--border); padding: 4px 10px; border-radius: 10px; font-size: 12px; }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(5px); }
        .modal { background: var(--card-bg); width: 90%; max-width: 400px; max-height: 90vh; border-radius: 24px; padding: 25px; overflow-y: auto; position: relative; }
        .modal-close { position: absolute; top: 15px; right: 15px; font-size: 24px; cursor: pointer; z-index: 10; background: rgba(0,0,0,0.5); width: 30px; height: 30px; text-align: center; line-height: 30px; border-radius: 50%; color: white; }
        .detail-row { margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; }
        .detail-label { font-size: 12px; color: var(--text-sub); }
        .detail-val { font-size: 16px; margin-top: 5px; word-break: break-all; }
        .photo-area { text-align: center; margin-bottom: 20px; cursor: zoom-in; }
        .photo-area img { width: 100%; border-radius: 12px; max-height: 300px; object-fit: cover; display: none; transition: 0.3s; }
        .photo-area img.zoomed { object-fit: contain; max-height: 60vh; background: #000; }
        
        .btn-back { position: fixed; bottom: 20px; right: 20px; background: var(--primary); color: #fff; padding: 12px 24px; border-radius: 50px; text-decoration: none; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 50; }
        .action-btn { display: inline-block; background: #4285F4; color: white; padding: 4px 10px; border-radius: 12px; font-size: 12px; text-decoration: none; margin-left: 5px; }
        .line-btn { background: #06C755; }
    </style>
</head>
<body>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜尋姓名、電話或學校..." oninput="searchStaff()">
    </div>

    <div class="tabs">
        <div class="tab-btn active" onclick="switchTab('list')">👥 列表</div>
        <div class="tab-btn" onclick="switchTab('analysis')">📊 大數據</div>
        <div class="tab-btn" onclick="switchTab('birthday')">🎂 本月壽星</div>
        <div class="tab-btn" onclick="switchTab('fate')">🔮 命運算命</div>
    </div>

    <div id="list-section" class="section active">
        <div id="list"></div>
        <div style="text-align:center; color:#888; font-size:12px; margin-top:20px;">
            共 <span id="totalCount">0</span> 位夥伴
        </div>
    </div>

    <div id="analysis-section" class="section">
        <div class="chart-card">
            <div class="chart-title">🎂 年齡層分布</div>
            <div id="chart-age"></div>
        </div>
        <div class="chart-card">
            <div class="chart-title">👫 性別分布 (依身分證)</div>
            <div id="chart-gender"></div>
        </div>
        <div class="chart-card">
            <div class="chart-title">📍 居住地分布</div>
            <div id="chart-loc"></div>
        </div>
        <div class="chart-card">
            <div class="chart-title">🎓 學校/科系分布</div>
            <div id="chart-school"></div>
        </div>
    </div>

    <div id="birthday-section" class="section">
        <div class="calendar-header">
            <button class="cal-btn" onclick="changeMonth(-1)">◀</button>
            <div class="cal-month" id="calMonth">...</div>
            <button class="cal-btn" onclick="changeMonth(1)">▶</button>
        </div>
        <div id="birthday-list" class="birthday-grid"></div>
    </div>

    <div id="fate-section" class="section">
        <div class="chart-card">
            <div class="chart-title">🔢 生命靈數分析</div>
            <p style="font-size:12px; color:#888; margin-bottom:15px;">將西元出生年月日的數字加總，直到剩下個位數，代表一個人的天賦特質。</p>
            <div id="fate-container"></div>
        </div>
    </div>

    <a href="dashboard.html" class="btn-back">⬅️ 返回</a>

    <div id="detailModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal">
            <span class="modal-close" onclick="document.getElementById('detailModal').style.display='none'">×</span>
            
            <div class="photo-area" onclick="toggleZoom(this)">
                <img id="d-photo" src="" alt="員工照片" onerror="this.style.display='none'">
                <div id="d-avatar-text" class="avatar-small" style="width:100px; height:100px; font-size:36px; margin:0 auto; display:none;"></div>
                <div style="font-size:10px; color:#666; margin-top:5px;">(點擊照片可切換完整顯示)</div>
            </div>

            <div class="detail-row"><div class="detail-label">姓名</div><div class="detail-val" id="d-name"></div></div>
            <div class="detail-row"><div class="detail-label">入職時間</div><div class="detail-val" id="d-entry"></div></div>
            <div class="detail-row"><div class="detail-label">生日 (歲數)</div><div class="detail-val" id="d-age"></div></div>
            <div class="detail-row">
                <div class="detail-label">電話 & LINE</div>
                <div class="detail-val">
                    <span id="d-phone"></span>
                    <a id="d-line-link" href="#" target="_blank" class="action-btn line-btn">LINE</a>
                </div>
            </div>
            <div class="detail-row"><div class="detail-label">身高體重</div><div class="detail-val" id="d-body"></div></div>
            <div class="detail-row"><div class="detail-label">學校/系級</div><div class="detail-val" id="d-school"></div></div>
            <div class="detail-row">
                <div class="detail-label">地址</div>
                <div class="detail-val">
                    <span id="d-addr"></span>
                    <a id="d-map-link" href="#" target="_blank" class="action-btn">🗺️ 導航</a>
                </div>
            </div>
            <div class="detail-row"><div class="detail-label">身分證</div><div class="detail-val" id="d-id"></div></div>
            <div class="detail-row"><div class="detail-label">自我介紹</div><div class="detail-val" id="d-intro"></div></div>
        </div>
    </div>

    <script>
        if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');

        const cachedDB = localStorage.getItem('STAFF_DB_CACHE');
        if (!cachedDB) { alert('請先登入以同步資料'); window.location.href = 'index.html'; }
        
        const STAFF_DB = JSON.parse(cachedDB);
        let staffList = Object.values(STAFF_DB);
        
        // 預設排序：入職時間
        staffList.sort((a, b) => new Date(b.entryDate || 0) - new Date(a.entryDate || 0));

        // === 1. 列表渲染 ===
        function renderList(list = staffList) {
            const listEl = document.getElementById('list');
            listEl.innerHTML = "";
            document.getElementById('totalCount').innerText = list.length;

            list.forEach(staff => {
                let age = getAge(staff.birthday);
                let school = staff.school || "無學校";
                let phone = staff.phone || "";

                const card = document.createElement('div');
                card.className = 'staff-card';
                card.onclick = () => showDetail(staff);
                
                let avatarHtml = `<div class="avatar-small">${staff.name.slice(-2)}</div>`;
                if (staff.photo) {
                    const photoUrl = convertDriveLink(staff.photo);
                    avatarHtml = `<img src="${photoUrl}" class="avatar-small" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"><div class="avatar-small" style="display:none">${staff.name.slice(-2)}</div>`;
                }

                card.innerHTML = `
                    ${avatarHtml}
                    <div class="info">
                        <div class="name">${staff.name}</div>
                        <div class="sub-info">
                            <span class="tag">${age}歲</span>
                            <span class="tag">${phone}</span>
                            <span class="tag">${school}</span>
                        </div>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        // === 2. 搜尋 ===
        function searchStaff() {
            const k = document.getElementById('searchInput').value.toLowerCase();
            const filtered = staffList.filter(s => 
                (s.name && s.name.includes(k)) || 
                (s.phone && s.phone.includes(k)) ||
                (s.school && s.school.includes(k))
            );
            renderList(filtered);
        }

        // === 3. 分析圖表 ===
        function renderAnalysis() {
            // 性別 (由身分證第2碼判斷)
            let genderCount = { "男": 0, "女": 0, "未知": 0 };
            // 年齡
            let ageCount = { "18以下": 0, "19-22": 0, "23-25": 0, "26以上": 0 };
            // 地點 (取前兩個字，如台北、台中)
            let locCount = {};
            // 學校
            let schoolCount = {};

            staffList.forEach(s => {
                // 性別
                if(s.id && s.id.length === 10) {
                    let g = s.id[1];
                    if(g === '1') genderCount["男"]++;
                    else if(g === '2') genderCount["女"]++;
                    else genderCount["未知"]++;
                } else genderCount["未知"]++;

                // 年齡
                let age = getAge(s.birthday);
                if(age !== "?") {
                    if(age <= 18) ageCount["18以下"]++;
                    else if(age <= 22) ageCount["19-22"]++;
                    else if(age <= 25) ageCount["23-25"]++;
                    else ageCount["26以上"]++;
                }

                // 地點
                if(s.origin) {
                    let loc = s.origin.substring(0, 2);
                    locCount[loc] = (locCount[loc] || 0) + 1;
                }

                // 學校
                if(s.school) {
                    let sch = s.school.split('/')[0] || s.school; // 只取學校名
                    schoolCount[sch] = (schoolCount[sch] || 0) + 1;
                }
            });

            drawChart('chart-age', ageCount);
            drawChart('chart-gender', genderCount);
            drawChart('chart-loc', locCount);
            drawChart('chart-school', schoolCount);
        }

        function drawChart(id, data) {
            const el = document.getElementById(id);
            el.innerHTML = "";
            let total = Object.values(data).reduce((a,b)=>a+b, 0);
            // 排序並取前5名 (針對學校/地點)
            let sorted = Object.entries(data).sort((a,b)=>b[1]-a[1]).slice(0, 8);
            
            sorted.forEach(([label, val]) => {
                let pct = Math.round((val / total) * 100);
                el.innerHTML += `
                    <div class="bar-row">
                        <div class="bar-label">${label}</div>
                        <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
                        <div class="bar-val">${val}</div>
                    </div>
                `;
            });
        }

        // === 4. 壽星日曆 ===
        let currentMonth = new Date().getMonth() + 1; // 1-12
        function renderBirthday() {
            document.getElementById('calMonth').innerText = `${currentMonth} 月壽星`;
            const el = document.getElementById('birthday-list');
            el.innerHTML = "";
            
            let bdayStaff = staffList.filter(s => {
                if(!s.birthday) return false;
                let m = 0;
                // 處理 YYYY/MM/DD
                let parts = String(s.birthday).split('/');
                if(parts.length > 1) m = parseInt(parts[1]);
                return m === currentMonth;
            });

            // 依日期排序
            bdayStaff.sort((a,b) => {
                let da = parseInt(a.birthday.split('/')[2]);
                let db = parseInt(b.birthday.split('/')[2]);
                return da - db;
            });

            if(bdayStaff.length === 0) el.innerHTML = "<div style='grid-column:1/-1; color:#888; margin-top:20px;'>本月無壽星</div>";

            bdayStaff.forEach(s => {
                let d = s.birthday.split('/')[2];
                el.innerHTML += `
                    <div class="b-card">
                        <div class="b-date">${currentMonth}/${d}</div>
                        <div class="b-name">${s.name}</div>
                    </div>
                `;
            });
        }
        function changeMonth(delta) {
            currentMonth += delta;
            if(currentMonth > 12) currentMonth = 1;
            if(currentMonth < 1) currentMonth = 12;
            renderBirthday();
        }

        // === 5. 算命 (生命靈數) ===
        function renderFate() {
            const el = document.getElementById('fate-container');
            el.innerHTML = "";
            let groups = {};

            staffList.forEach(s => {
                if(!s.birthday) return;
                let num = calcLifePath(s.birthday);
                if(!groups[num]) groups[num] = [];
                groups[num].push(s.name);
            });

            const meanings = {
                1: "開創、獨立、領導", 2: "協調、合作、細心", 3: "創意、表達、社交",
                4: "穩定、秩序、執行", 5: "自由、冒險、變動", 6: "關懷、責任、奉獻",
                7: "分析、真理、探究", 8: "權力、富足、掌控", 9: "智慧、大愛、人道"
            };

            for(let i=1; i<=9; i++) {
                if(groups[i]) {
                    let names = groups[i].map(n => `<span class="fate-person">${n}</span>`).join("");
                    el.innerHTML += `
                        <div class="fate-group">
                            <div class="fate-num">${i}</div>
                            <div class="fate-desc">${meanings[i] || ""}號人</div>
                            <div class="fate-list">${names}</div>
                        </div>
                    `;
                }
            }
        }
        
        function calcLifePath(dateStr) {
            // dateStr: 1994/12/22
            let digits = dateStr.replace(/\D/g, '').split('').map(Number);
            let sum = digits.reduce((a,b)=>a+b, 0);
            while(sum > 9) {
                // 一般生命靈數加到個位數 (11, 22, 33 卓越數暫不處理，簡化為 2, 4, 6)
                sum = String(sum).split('').map(Number).reduce((a,b)=>a+b, 0);
            }
            return sum;
        }

        // === 共用工具 ===
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            
            // 找出按鈕跟區塊
            const btns = document.querySelectorAll('.tab-btn');
            const sections = ['list', 'analysis', 'birthday', 'fate'];
            
            btns[sections.indexOf(tabName)].classList.add('active');
            document.getElementById(`${tabName}-section`).classList.add('active');

            if(tabName === 'analysis') renderAnalysis();
            if(tabName === 'birthday') renderBirthday();
            if(tabName === 'fate') renderFate();
        }

        function showDetail(staff) {
            document.getElementById('d-name').innerText = staff.name;
            document.getElementById('d-phone').innerHTML = `${staff.phone} ${staff.phone ? '<br>' : ''}`;
            document.getElementById('d-body').innerText = staff.bodyInfo || "-";
            document.getElementById('d-addr').innerText = staff.address || "-";
            document.getElementById('d-id').innerText = staff.id || "-";
            document.getElementById('d-intro').innerText = staff.intro || "無";
            document.getElementById('d-school').innerText = staff.school || "-";
            document.getElementById('d-age').innerText = `${staff.birthday || "?"} (${getAge(staff.birthday)}歲)`;

            // LINE 連結
            const lineLink = document.getElementById('d-line-link');
            if (staff.lineId) {
                lineLink.href = `https://line.me/ti/p/~${staff.lineId}`;
                lineLink.style.display = 'inline-block';
            } else { lineLink.style.display = 'none'; }

            // 地圖連結
            const mapLink = document.getElementById('d-map-link');
            if (staff.address) {
                mapLink.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(staff.address)}`;
                mapLink.style.display = 'inline-block';
            } else { mapLink.style.display = 'none'; }

            // 照片
            const photoEl = document.getElementById('d-photo');
            const avatarText = document.getElementById('d-avatar-text');
            photoEl.classList.remove('zoomed'); 
            
            if (staff.photo) {
                photoEl.src = convertDriveLink(staff.photo);
                photoEl.style.display = 'block';
                avatarText.style.display = 'none';
            } else {
                photoEl.style.display = 'none';
                avatarText.innerText = staff.name.slice(-2);
                avatarText.style.display = 'flex';
            }
            
            // 入職時間
            let entryStr = "未登記";
            if(staff.entryDate) {
                const d = new Date(staff.entryDate);
                entryStr = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
            }
            document.getElementById('d-entry').innerText = entryStr;

            document.getElementById('detailModal').style.display = 'flex';
        }

        function getAge(birthdayStr) {
            if(!birthdayStr) return "?";
            let parts = String(birthdayStr).split('/');
            if (parts.length < 1) return "?";
            let year = parseInt(parts[0]);
            if (year < 1911) year += 1911; 
            return new Date().getFullYear() - year;
        }

        function toggleZoom(container) {
            const img = container.querySelector('img');
            if(img && img.style.display !== 'none') img.classList.toggle('zoomed');
        }
        function closeModal(e) { if(e.target.id === 'detailModal') document.getElementById('detailModal').style.display = 'none'; }
        function convertDriveLink(url) {
            if (!url) return "";
            let match = url.match(/\/d\/(.+?)\//) || url.match(/id=([a-zA-Z0-9_-]+)/);
            if (match && match[1]) return `https://lh3.googleusercontent.com/d/${match[1]}`;
            return url;
        }

        renderList();
    </script>
</body>
</html>
