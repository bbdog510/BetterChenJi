<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>員工資料庫</title>
    <link rel="icon" href="img/logo.png" type="image/png">
    <style>
        :root { --bg-color: #121212; --text-main: #E0E0E0; --text-sub: #AAAAAA; --card-bg: #1E1E1E; --primary: #CE93D8; --border: #333; --highlight: #FFD54F; --tag-active: #FFD54F; }
        body.light-mode { --bg-color: #FDFCF4; --text-main: #1C1B1F; --text-sub: #666666; --card-bg: #FFF; --primary: #6200EE; --border: #E0E0E0; --highlight: #FFD600; --tag-active: #FFD600; }
        
        body { font-family: 'MiSans', sans-serif; background: var(--bg-color); color: var(--text-main); padding: 20px; margin: 0; padding-bottom: 80px; }
        
        .search-box { position: sticky; top: 0; background: var(--bg-color); padding: 10px 0; z-index: 10; display: flex; gap: 10px; border-bottom: 1px solid var(--border); }
        input { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-main); outline: none; font-size: 16px; }
        
        .tabs { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; }
        .tab-btn { background: var(--card-bg); color: var(--text-sub); border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; flex: 1 0 auto; text-align: center; }
        .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        
        .section { display: none; margin-top: 20px; }
        .section.active { display: block; }

        .staff-card { background: var(--card-bg); padding: 15px; border-radius: 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 15px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
        .staff-card:active { transform: scale(0.98); }
        .staff-card.is-me { border: 2px solid var(--highlight); background: rgba(255, 213, 79, 0.1); }
        
        .avatar-small { width: 50px; height: 50px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 18px; object-fit: cover; flex-shrink: 0; }
        .info { flex: 1; }
        .name { font-size: 18px; font-weight: bold; }
        .sub-info { font-size: 12px; color: var(--text-sub); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 8px; }
        .tag { background: rgba(125,125,125,0.1); padding: 2px 6px; border-radius: 4px; }

        .pagination { display: flex; justify-content: space-between; margin: 20px 0; }
        .page-btn { padding: 8px 16px; background: var(--card-bg); border-radius: 12px; cursor: pointer; border: 1px solid var(--border); color: var(--text-main); }

        .chart-card { background: var(--card-bg); padding: 20px; border-radius: 16px; margin-bottom: 15px; }
        .chart-title { font-weight: bold; margin-bottom: 15px; color: var(--primary); }
        .bar-row { display: flex; align-items: center; margin-bottom: 8px; font-size: 12px; }
        .bar-label { width: 100px; text-align: right; margin-right: 10px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .bar-bg { flex: 1; background: rgba(125,125,125,0.1); height: 10px; border-radius: 5px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--primary); border-radius: 5px; }
        .bar-val { width: 40px; margin-left: 10px; color: var(--text-main); font-size: 11px;}

        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: var(--card-bg); padding: 10px; border-radius: 12px; }
        .cal-btn { background: none; border: none; font-size: 20px; color: var(--primary); cursor: pointer; padding: 0 15px; }
        .cal-month { font-size: 18px; font-weight: bold; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; font-size: 12px; }
        .cal-day-header { color: var(--text-sub); padding-bottom: 5px; }
        .cal-cell { min-height: 50px; background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border); padding: 4px; display: flex; flex-direction: column; align-items: center; }
        .cal-cell.today { border: 2px solid var(--primary); background: rgba(206, 147, 216, 0.1); }
        .cal-date-num { font-weight: bold; margin-bottom: 2px; }
        .cal-person { background: var(--primary); color: #fff; font-size: 10px; border-radius: 4px; padding: 2px 4px; margin-top: 2px; cursor: pointer; width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cal-person.is-me { background: var(--highlight); color: #000; border: 1px solid #fff; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(5px); }
        .modal { background: var(--card-bg); width: 90%; max-width: 400px; max-height: 90vh; border-radius: 24px; padding: 25px; overflow-y: auto; position: relative; display: flex; flex-direction: column; }
        .modal-close { position: absolute; top: 15px; right: 15px; font-size: 24px; cursor: pointer; z-index: 10; background: rgba(0,0,0,0.5); width: 30px; height: 30px; text-align: center; line-height: 30px; border-radius: 50%; color: white; }
        .detail-row { margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; }
        .detail-label { font-size: 12px; color: var(--text-sub); margin-bottom: 5px; }
        .detail-val { font-size: 16px; word-break: break-all; }
        
        .photo-area { text-align: center; margin-bottom: 20px; cursor: zoom-in; }
        .photo-area img { width: 100%; border-radius: 12px; max-height: 300px; object-fit: cover; display: none; transition: 0.3s; }
        .photo-area img.zoomed { object-fit: contain; max-height: 60vh; background: #000; }
        
        .btn-back { position: fixed; bottom: 20px; right: 20px; background: var(--primary); color: #fff; padding: 12px 24px; border-radius: 50px; text-decoration: none; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 50; }
        .inline-content { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
        .icon-btn { text-decoration: none; font-size: 20px; transition: transform 0.2s; }
        .icon-btn:active { transform: scale(1.2); }

        .history-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .history-item { padding: 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; border: 1px solid transparent; }
        .history-item.active { background: rgba(255, 213, 79, 0.15); border-color: var(--tag-active); color: var(--text-main); font-weight: bold; }
        .history-item.active .h-tag { background: var(--tag-active); color: #000; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        .history-item.inactive { background: rgba(125,125,125,0.05); color: #666; }
        .history-item.inactive .h-tag { display: none; }
        
        .roster-group { margin-bottom: 20px; background: rgba(255,255,255,0.03); padding: 10px; border-radius: 12px; }
        .roster-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px dashed #555; padding-bottom: 5px; }
        .roster-loc { font-weight: bold; color: var(--primary); font-size: 15px; }
        .roster-names { display: flex; flex-wrap: wrap; gap: 8px; }
        .roster-person { background: var(--card-bg); border: 1px solid #555; padding: 4px 10px; border-radius: 12px; font-size: 13px; cursor: pointer; }
        .roster-person:active { background: var(--primary); color: #fff; }
        
        .btn-copy-ins { background: #4285F4; color: white; border: none; border-radius: 20px; padding: 4px 10px; font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .btn-copy-ins:active { transform: scale(0.95); opacity: 0.8; }

        .fate-group { margin-bottom: 20px; } .fate-header { display: flex; align-items: center; margin-bottom: 8px; } .fate-num { width: 30px; height: 30px; background: var(--primary); color: white; border-radius: 50%; text-align: center; line-height: 30px; font-weight: bold; margin-right: 10px; } .fate-desc { font-size: 14px; font-weight: bold; } .fate-detail { font-size: 12px; color: var(--text-sub); margin-bottom: 10px; line-height: 1.4; padding-left: 40px; } .fate-list { display: flex; flex-wrap: wrap; gap: 8px; padding-left: 40px; } .fate-person { background: var(--card-bg); border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; } .fate-person.is-me { border: 2px solid var(--highlight); background: rgba(255, 213, 79, 0.2); font-weight: bold; }
    </style>
</head>
<body>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜尋姓名、電話、學校、檔期(如2026元宵)..." oninput="searchStaff()">
    </div>

    <div class="tabs">
        <div class="tab-btn active" onclick="switchTab('list')">👥 列表</div>
        <div class="tab-btn" onclick="switchTab('analysis')">📊 大數據</div>
        <div class="tab-btn" onclick="switchTab('birthday')">📅 壽星行事曆</div>
        <div class="tab-btn" onclick="switchTab('fate')">🔮 靈數算命</div>
    </div>

    <div id="list-section" class="section active">
        <div class="pagination"><button class="page-btn" onclick="prevPage()">上一頁</button><span id="pageInfo" style="font-size: 12px; line-height: 34px; color: #888;"></span><button class="page-btn" onclick="nextPage()">下一頁</button></div>
        <div id="list"></div>
        <div class="pagination"><button class="page-btn" onclick="prevPage()">上一頁</button><button class="page-btn" onclick="nextPage()">下一頁</button></div>
    </div>

    <div id="analysis-section" class="section">
        <div class="chart-card"><div class="chart-title">🏆 服務總時數 TOP 10</div><div id="chart-top-hours"></div></div>
        <div class="chart-card"><div class="chart-title">⭐ 服務總次數 TOP 10</div><div id="chart-top-count"></div></div>
        <div class="chart-card"><div class="chart-title">🎂 年齡層分布</div><div id="chart-age"></div></div>
        <div class="chart-card"><div class="chart-title">👫 性別分布</div><div id="chart-gender"></div></div>
        <div class="chart-card"><div class="chart-title">📍 居住地 (縣市)</div><div id="chart-loc"></div></div>
        <div class="chart-card"><div class="chart-title">🎓 學校/科系</div><div id="chart-school"></div></div>
    </div>
    
    <div id="birthday-section" class="section">
        <div class="calendar-header"><button class="cal-btn" onclick="changeMonth(-1)">◀</button><div class="cal-month" id="calMonth">...</div><button class="cal-btn" onclick="changeMonth(1)">▶</button></div>
        <div class="calendar-grid"><div class="cal-day-header">日</div><div class="cal-day-header">一</div><div class="cal-day-header">二</div><div class="cal-day-header">三</div><div class="cal-day-header">四</div><div class="cal-day-header">五</div><div class="cal-day-header">六</div></div>
        <div id="cal-body" class="calendar-grid"></div>
    </div>
    
    <div id="fate-section" class="section"><div class="chart-card"><div class="chart-title">🔢 生命靈數分析</div><div id="fate-container"></div></div></div>

    <a href="dashboard.html" class="btn-back">⬅️ 返回</a>

    <div id="detailModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal">
            <span class="modal-close" onclick="document.getElementById('detailModal').style.display='none'">×</span>
            <div class="photo-area" onclick="toggleZoom(this)">
                <img id="d-photo" src="" alt="員工照片" onerror="this.style.display='none'">
                <div id="d-avatar-text" class="avatar-small" style="width:100px; height:100px; font-size:36px; margin:0 auto; display:none;"></div>
            </div>
            <div class="detail-row"><div class="detail-label">姓名</div><div class="detail-val" id="d-name"></div></div>
            <div class="detail-row"><div class="detail-label">入職時間</div><div class="detail-val" id="d-entry"></div></div>
            <div class="detail-row"><div class="detail-label">電話 / LINE</div><div class="detail-val inline-content"><span id="d-phone"></span><a id="d-call-btn" href="#" class="icon-btn">📞</a><a id="d-line-btn" href="#" target="_blank" class="icon-btn">💬</a></div></div>
            <div class="detail-row"><div class="detail-label">地址</div><div class="detail-val inline-content"><span id="d-addr" style="flex:1;"></span><a id="d-map-btn" href="#" target="_blank" class="icon-btn">🗺️</a></div></div>
            <div class="detail-row"><div class="detail-label">學校/系級</div><div class="detail-val" id="d-school"></div></div>
            <div class="detail-row"><div class="detail-label">身分證</div><div class="detail-val" id="d-id"></div></div>
            
            <div class="detail-row">
                <div class="detail-label">服務紀錄與履歷</div>
                <div class="detail-val" style="color:var(--highlight); font-weight:bold; margin-bottom:10px;">
                    共 <span id="d-count">0</span> 次檔期 (累積 <span id="d-hours">0</span> 小時)
                </div>
                <div id="d-history-list" class="history-list"></div>
            </div>
        </div>
    </div>

    <div id="rosterModal" class="modal-overlay" onclick="closeRosterModal(event)">
        <div class="modal" style="max-height: 80vh;">
            <span class="modal-close" onclick="document.getElementById('rosterModal').style.display='none'">×</span>
            <h2 id="r-title" style="margin-top:0; color:var(--highlight); text-align:center;">檔期名單</h2>
            <div id="r-content" style="margin-top:15px;"></div>
        </div>
    </div>

    <script>
        if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');

        const cachedDB = localStorage.getItem('STAFF_DB_CACHE');
        const loggedInPhone = localStorage.getItem('loginPhone');
        
        if (!cachedDB) { alert('請先登入以同步資料'); window.location.href = 'index.html'; }
        
        const STAFF_DB = JSON.parse(cachedDB);
        const ALL_EVENTS = STAFF_DB["_ALL_EVENTS_"] || [];
        delete STAFF_DB["_ALL_EVENTS_"];
        delete STAFF_DB["_ERROR_"];

        let staffList = Object.values(STAFF_DB);
        staffList.sort((a, b) => new Date(b.entryDate || 0) - new Date(a.entryDate || 0));

        let currentPage = 1;
        const itemsPerPage = 20;
        let filteredList = staffList;

        // 🔥 北到南排序
        const CITY_ORDER = ["基隆", "台北", "新北", "桃園", "新竹", "苗栗", "台中", "彰化", "南投", "雲林", "嘉義", "台南", "高雄", "屏東", "宜蘭", "花蓮", "台東"];

        function renderList() { /* (保持原樣，略) */
            const listEl = document.getElementById('list'); listEl.innerHTML = "";
            const start = (currentPage - 1) * itemsPerPage; const end = start + itemsPerPage; const pageData = filteredList.slice(start, end);
            document.getElementById('pageInfo').innerText = `第 ${currentPage} 頁 / 共 ${Math.ceil(filteredList.length / itemsPerPage)} 頁`;
            pageData.forEach(staff => {
                let age = getAge(staff.birthday); let school = staff.school || "無"; let phone = staff.phone || "";
                const isMeClass = (staff.phone === loggedInPhone) ? "is-me" : "";
                const card = document.createElement('div'); card.className = `staff-card ${isMeClass}`; card.onclick = () => showDetail(staff);
                let avatarHtml = `<div class="avatar-small">${staff.name.slice(-2)}</div>`;
                if (staff.photo) { const photoUrl = convertDriveLink(staff.photo); avatarHtml = `<img src="${photoUrl}" class="avatar-small" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"><div class="avatar-small" style="display:none">${staff.name.slice(-2)}</div>`; }
                let serviceCount = staff.history ? Object.keys(staff.history).length : 0;
                let serviceTag = serviceCount > 0 ? `<span class="tag" style="color:var(--highlight)">★${serviceCount}檔</span>` : "";
                card.innerHTML = `${avatarHtml}<div class="info"><div class="name">${staff.name} ${staff.alias ? `<small>(${staff.alias})</small>` : ''}</div><div class="sub-info"><span class="tag">${age}歲</span><span class="tag">${school}</span>${serviceTag}</div></div>`;
                listEl.appendChild(card);
            });
        }

        function searchStaff() { /* (保持原樣，略) */
            const k = document.getElementById('searchInput').value.toLowerCase();
            filteredList = staffList.filter(s => {
                let basicMatch = (s.name && s.name.includes(k)) || (s.phone && s.phone.includes(k)) || (s.school && s.school.includes(k));
                let historyMatch = false;
                if (s.history) { for (let event in s.history) { if (event.includes(k)) { historyMatch = true; break; } } }
                return basicMatch || historyMatch;
            });
            currentPage = 1; switchTab('list'); renderList();
        }

        function showDetail(staff) {
            document.getElementById('d-name').innerText = staff.name;
            document.getElementById('d-phone').innerText = staff.phone;
            document.getElementById('d-entry').innerText = getEntryDate(staff.entryDate);
            document.getElementById('d-school').innerText = staff.school || "-";
            document.getElementById('d-id').innerText = staff.id || "-";
            document.getElementById('d-call-btn').href = `tel:${staff.phone}`;
            const lineBtn = document.getElementById('d-line-btn');
            if(staff.lineId) { lineBtn.href = `https://line.me/ti/p/~${staff.lineId}`; lineBtn.style.display = 'inline-flex'; } else { lineBtn.style.display = 'none'; }
            const mapBtn = document.getElementById('d-map-btn');
            document.getElementById('d-addr').innerText = staff.address || "-";
            if(staff.address) { mapBtn.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(staff.address)}`; mapBtn.style.display = 'inline-flex'; } else { mapBtn.style.display = 'none'; }
            const photoEl = document.getElementById('d-photo');
            const avatarText = document.getElementById('d-avatar-text');
            photoEl.classList.remove('zoomed'); 
            if (staff.photo) { photoEl.src = convertDriveLink(staff.photo); photoEl.style.display = 'block'; avatarText.style.display = 'none'; } else { photoEl.style.display = 'none'; avatarText.innerText = staff.name.slice(-2); avatarText.style.display = 'flex'; }

            const history = staff.history || {};
            const count = Object.keys(history).length;
            const hours = staff.totalHours || 0;
            document.getElementById('d-count').innerText = count;
            document.getElementById('d-hours').innerText = hours;

            const listEl = document.getElementById('d-history-list');
            listEl.innerHTML = "";
            let sortedEvents = [...ALL_EVENTS].sort().reverse(); 

            sortedEvents.forEach(eventName => {
                const isAttended = history[eventName] !== undefined;
                const record = history[eventName] || {};
                const div = document.createElement('div');
                
                if (isAttended) {
                    div.className = 'history-item active';
                    
                    // 🔥🔥 重點修正：強力移除所有直槓和空白
                    let rawLoc = record.loc || "";
                    let niceLoc = rawLoc.replace(/\s*[|｜│]\s*/g, ""); // 移除 | ｜ │ 和周圍空白
                    
                    div.innerHTML = `${eventName} <span class="h-tag">${record.hours}h│${niceLoc}</span>`;
                    div.style.cursor = "pointer";
                    div.onclick = (e) => { e.stopPropagation(); openRosterModal(eventName); };
                } else {
                    div.className = 'history-item inactive';
                    div.innerHTML = `${eventName} (未參加)`;
                    div.style.cursor = "pointer";
                    div.onclick = (e) => { e.stopPropagation(); openRosterModal(eventName); };
                }
                listEl.appendChild(div);
            });
            document.getElementById('detailModal').style.display = 'flex';
        }

        // 🔥 北到南排序 + 強力符號清除
        function openRosterModal(eventName) {
            document.getElementById('r-title').innerText = `${eventName} 人員名單`;
            const contentEl = document.getElementById('r-content');
            contentEl.innerHTML = "載入中...";

            let groups = {}; 
            staffList.forEach(s => {
                if (s.history && s.history[eventName]) {
                    let loc = s.history[eventName].loc || "未知地點";
                    // 🔥 這裡也強力清除
                    let cleanLoc = loc.replace(/\s*[|｜│]\s*/g, "");
                    if (!groups[cleanLoc]) groups[cleanLoc] = [];
                    groups[cleanLoc].push(s);
                }
            });

            contentEl.innerHTML = "";
            if (Object.keys(groups).length === 0) { contentEl.innerHTML = "<div style='text-align:center; color:#888;'>此檔期尚無人員紀錄</div>"; return; }

            let sortedKeys = Object.keys(groups).sort((a, b) => {
                let indexA = CITY_ORDER.findIndex(city => a.includes(city));
                let indexB = CITY_ORDER.findIndex(city => b.includes(city));
                return (indexA === -1 ? 999 : indexA) - (indexB === -1 ? 999 : indexB);
            });

            sortedKeys.forEach(loc => {
                let section = document.createElement('div');
                section.className = 'roster-group';
                
                let header = document.createElement('div'); header.className = 'roster-header';
                let title = document.createElement('span'); title.className = 'roster-loc'; title.innerText = `📍 ${loc}`;
                let copyBtn = document.createElement('button'); copyBtn.className = 'btn-copy-ins'; copyBtn.innerHTML = '📋 複製保險名單';
                copyBtn.onclick = () => copyInsuranceList(loc, groups[loc]);
                header.appendChild(title); header.appendChild(copyBtn); section.appendChild(header);

                let namesDiv = document.createElement('div'); namesDiv.className = 'roster-names';
                groups[loc].forEach(s => {
                    let span = document.createElement('span'); span.className = 'roster-person'; span.innerText = s.name;
                    span.onclick = () => { document.getElementById('rosterModal').style.display = 'none'; showDetail(s); };
                    namesDiv.appendChild(span);
                });
                section.appendChild(namesDiv);
                contentEl.appendChild(section);
            });
            document.getElementById('rosterModal').style.display = 'flex';
        }

        function copyInsuranceList(locName, staffArray) { /* (保持原樣) */
            let text = `${locName}\n\n`;
            staffArray.forEach((s, index) => {
                let bDayStr = s.birthday || ""; let rocBday = "??.??.??";
                let parts = bDayStr.split(/[-/.]/); 
                if (parts.length >= 3) { let y = parseInt(parts[0]); let m = parts[1]; let d = parts[2]; if (y > 1911) y -= 1911; rocBday = `${y}.${m}.${d}`; } 
                else if (bDayStr.length >= 6) { rocBday = bDayStr; }
                text += `${index + 1}.${s.name} / ${rocBday} / ${s.id || "無身分證"} / ${s.phone}\n`;
            });
            navigator.clipboard.writeText(text).then(() => { alert(`✅ 已複製！`); }).catch(err => { alert("❌ 複製失敗"); });
        }

        // 大數據 (保持原樣)
        function renderAnalysis() {
            let gender={ "男":0, "女":0, "未知":0 }, age={ "18以下":0, "19-22":0, "23-25":0, "26以上":0 }, loc={}, school={};
            let topHours = [], topCounts = [];
            staffList.forEach(s => {
                if(s.id && s.id.length === 10) { let g = s.id[1]; if(g === '1') gender["男"]++; else if(g === '2') gender["女"]++; else gender["未知"]++; } else gender["未知"]++;
                let a = getAge(s.birthday); if(a!=="?") { if(a<=18) age["18以下"]++; else if(a<=22) age["19-22"]++; else if(a<=25) age["23-25"]++; else age["26以上"]++; }
                if(s.address) { let l = s.address.substring(0, 3); loc[l] = (loc[l] || 0) + 1; }
                if(s.school) { let sc = s.school.split('/')[0] || s.school; school[sc] = (school[sc] || 0) + 1; }
                if(s.totalHours > 0) topHours.push({name: s.name, val: s.totalHours});
                let count = s.history ? Object.keys(s.history).length : 0;
                if(count > 0) topCounts.push({name: s.name, val: count});
            });
            drawChart('chart-age', age); drawChart('chart-gender', gender); drawChart('chart-loc', loc); drawChart('chart-school', school);
            topHours.sort((a,b) => b.val - a.val); topCounts.sort((a,b) => b.val - a.val);
            drawRanking('chart-top-hours', topHours.slice(0, 10), 'hr'); drawRanking('chart-top-count', topCounts.slice(0, 10), '次');
        }
        function drawChart(id, data) { const el = document.getElementById(id); el.innerHTML = ""; let total = Object.values(data).reduce((a,b)=>a+b, 0); let sorted = Object.entries(data).sort((a,b)=>b[1]-a[1]).slice(0, 8); sorted.forEach(([label, val]) => { let pct = Math.round((val / total) * 100); el.innerHTML += `<div class="bar-row"><div class="bar-label">${label}</div><div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div><div class="bar-val">${val}</div></div>`; }); }
        function drawRanking(id, data, unit) { const el = document.getElementById(id); el.innerHTML = ""; if(data.length === 0) { el.innerHTML = "無資料"; return; } let max = data[0].val; data.forEach((item, i) => { let pct = (item.val / max) * 100; el.innerHTML += `<div class="bar-row"><div class="bar-label" style="width:30px;">#${i+1}</div><div class="bar-label">${item.name}</div><div class="bar-bg"><div class="bar-fill" style="width:${pct}%; background:#FFD54F;"></div></div><div class="bar-val" style="width:50px;">${item.val}${unit}</div></div>`; }); }

        // 輔助函式
        function closeRosterModal(e) { if(e.target.id === 'rosterModal') document.getElementById('rosterModal').style.display = 'none'; }
        function getAge(birthdayStr) { if(!birthdayStr) return "?"; let parts = String(birthdayStr).split(/[-/.]/); if(parts.length < 3) return "?"; let y = parseInt(parts[0]); if(y < 1911) y += 1911; return new Date().getFullYear() - y; }
        function getEntryDate(ts) { if(!ts) return "未登記"; const d = new Date(ts); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; }
        function convertDriveLink(url) { if (!url) return ""; let match = url.match(/\/d\/(.+?)\//) || url.match(/id=([a-zA-Z0-9_-]+)/); if (match && match[1]) return `https://lh3.googleusercontent.com/d/${match[1]}`; return url; }
        function toggleZoom(container) { const img = container.querySelector('img'); if(img && img.style.display !== 'none') img.classList.toggle('zoomed'); }
        function closeModal(e) { if(e.target.id === 'detailModal') document.getElementById('detailModal').style.display = 'none'; }
        function prevPage() { if(currentPage > 1) { currentPage--; renderList(); window.scrollTo(0,0); } }
        function nextPage() { if(currentPage * itemsPerPage < filteredList.length) { currentPage++; renderList(); window.scrollTo(0,0); } }
        function switchTab(tabName) { document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); document.querySelectorAll('.section').forEach(s => s.classList.remove('active')); const btns = document.querySelectorAll('.tab-btn'); const sections = ['list', 'analysis', 'birthday', 'fate']; btns[sections.indexOf(tabName)].classList.add('active'); document.getElementById(`${tabName}-section`).classList.add('active'); if(tabName === 'analysis') renderAnalysis(); if(tabName === 'birthday') renderBirthday(); if(tabName === 'fate') renderFate(); }
        function renderFate() { /* 略 */ } function calcLifePath(dateStr) { /* 略 */ } function renderBirthday() { /* 略 */ } function changeMonth(delta) { /* 略 */ } function findAndShow(phone) { const s = staffList.find(x => x.phone === phone); if(s) showDetail(s); }

        renderList();
    </script>
