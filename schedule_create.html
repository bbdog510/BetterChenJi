<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排班表生成器</title>
    <link rel="icon" href="img/logo.png" type="image/png">
    <style>
        :root { --bg: #121212; --card: #1E1E1E; --text: #E0E0E0; --primary: #FFD54F; }
        body { font-family: 'MiSans', sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 600px; background: var(--card); padding: 30px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: var(--primary); text-align: center; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #aaa; }
        input, textarea { width: 100%; box-sizing: border-box; background: #333; border: 1px solid #555; color: #fff; padding: 12px; border-radius: 10px; font-size: 16px; margin-bottom: 20px; outline: none; }
        textarea { height: 300px; font-family: monospace; line-height: 1.5; }
        .btn-gen { width: 100%; padding: 15px; background: var(--primary); color: #000; font-weight: bold; font-size: 18px; border: none; border-radius: 50px; cursor: pointer; transition: 0.3s; }
        .btn-gen:disabled { background: #555; color: #888; cursor: not-allowed; }
        .status { text-align: center; margin-top: 20px; font-weight: bold; white-space: pre-line; min-height: 24px;}
        .row-group { display: flex; gap: 10px; }
        .row-group input { flex: 1; }
        .btn-back { display: block; margin-top: 20px; color: #888; text-decoration: none; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📅 智慧排班表生成器 V5.0</h1>
        
        <div class="row-group">
            <div><label>年份</label><input type="number" id="yearInput" value="2026"></div>
            <div><label>檔期名稱 (如:元宵)</label><input type="text" id="eventInput" value="元宵"></div>
        </div>
        
        <label>原始資料 (請直接貼上 LINE/文字檔)</label>
        <textarea id="dataInput" placeholder="範例：
1.City’Super 復興SOGO店
時間：2026/2/19（四）- 2026/3/3（二）
..."></textarea>

        <button id="genBtn" class="btn-gen" onclick="generate()">🚀 開始生成</button>
        <div id="status" class="status"></div>
        
        <a href="dashboard.html" class="btn-back">⬅️ 返回戰情室</a>
    </div>

    <script>
        // 🔴 請填入你剛剛部署的 API 網址
        const API_URL = "https://script.google.com/macros/s/AKfycbxHlrHtxs3TEU0waQi0Dy-CVKSg-FBONbApp3xhyO1kMfRGvHCQzECz3pWcpbDhAl67PA/exec"; 

        function generate() {
            const year = document.getElementById('yearInput').value;
            const eventName = document.getElementById('eventInput').value;
            const text = document.getElementById('dataInput').value;
            const btn = document.getElementById('genBtn');
            const status = document.getElementById('status');

            if(!text.trim()) { alert("請貼上資料！"); return; }

            btn.disabled = true;
            btn.innerText = "⏳ 正在分析資料並繪製表格...";
            status.innerText = "指令已發送，約需 10-20 秒，請稍候...";
            status.style.color = "#FFD54F";

            fetch(API_URL, {
                method: "POST",
                mode: "no-cors", 
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ year: year, eventName: eventName, text: text })
            })
            .then(() => {
                status.innerText = "✅ 指令已送出！\n請至 Google Sheet 確認分頁：\n" + year + eventName;
                status.style.color = "#4CAF50";
                btn.innerText = "🚀 再次生成";
                btn.disabled = false;
            })
            .catch(err => {
                status.innerText = "❌ 發送失敗";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
