<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>排班表生成器</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/logo.png" type="image/png">
    <style>
        :root { --bg: #121212; --card: #1E1E1E; --text: #E0E0E0; --primary: #FFD54F; }
        body { font-family: 'MiSans', sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 600px; background: var(--card); padding: 30px; border-radius: 20px; }
        h1 { color: var(--primary); text-align: center; }
        textarea { width: 100%; height: 300px; background: #333; color: #fff; border-radius: 10px; padding: 10px; border: 1px solid #555; }
        .btn-gen { width: 100%; padding: 15px; background: var(--primary); font-weight: bold; border-radius: 50px; cursor: pointer; border:none; margin-top:20px; }
        .btn-link { display: none; width: 100%; padding: 15px; margin-top: 15px; background: #4CAF50; color: #fff; font-weight: bold; border-radius: 50px; text-align: center; text-decoration: none; cursor: pointer; }
        .status { text-align: center; margin-top: 20px; color: #fff; white-space: pre-line; }
        input { background:#333; border:1px solid #555; color:#fff; padding:10px; border-radius:5px; width:45%; }
        .row { display:flex; justify-content:space-between; margin-bottom:15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 智慧排班表生成器 V5.3</h1>
        <div class="row">
            <input type="number" id="yearInput" value="2026">
            <input type="text" id="eventInput" value="元宵">
        </div>
        <textarea id="dataInput" placeholder="請直接貼上 LINE 傳來的完整檔期文字..."></textarea>
        <button id="genBtn" class="btn-gen" onclick="generate()">🚀 開始生成</button>
        <div id="status" class="status"></div>
        <a id="sheetLink" href="#" target="_blank" class="btn-link">📂 開啟生成的班表</a>
        <a href="dashboard.html" style="display:block; text-align:center; margin-top:20px; color:#888; text-decoration:none;">⬅️ 返回戰情室</a>
    </div>

    <script>
        // 🔴 請務必確認網址正確
        const API_URL = "https://script.google.com/macros/s/AKfycbxLk2PiCVrQU28ZFg7zFWoiqPYedQNaHlNyoxXNvfBWafy2Ji7CZeQz3s1LJNtHvhcZxA/exec"; 
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/1GyPTKfZvHd7bHHiz2UMj5gfATwAhNCsqZwLmT1W-DsE/edit";

        function generate() {
            const btn = document.getElementById('genBtn');
            const status = document.getElementById('status');
            const linkBtn = document.getElementById('sheetLink');
            const text = document.getElementById('dataInput').value;

            if(!text.trim()) { alert("❌ 請貼上資料！"); return; }

            btn.disabled = true;
            btn.innerText = "⏳ 正在強力解析...";
            status.innerText = "訊號發射中，請稍候...";
            status.style.color = "#FFD54F";
            linkBtn.style.display = "none";

            fetch(API_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ 
                    year: document.getElementById('yearInput').value, 
                    eventName: document.getElementById('eventInput').value, 
                    text: text 
                })
            }).then(() => {
                status.innerText = "✅ 成功！表格已生成。\n(如果看到白卷，請稍等 5 秒再重新整理 Sheet)";
                status.style.color = "#4CAF50";
                btn.innerText = "🚀 再次生成";
                btn.disabled = false;
                linkBtn.href = SHEET_URL;
                linkBtn.style.display = "block";
            }).catch(err => {
                status.innerText = "❌ 失敗";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
