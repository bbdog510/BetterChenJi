<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>排班表生成器</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/logo.png" type="image/png">
    <style>
        :root { --bg: #121212; --card: #1E1E1E; --text: #E0E0E0; --primary: #FFD54F; }
        body { font-family: 'MiSans', sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 600px; background: var(--card); padding: 30px; border-radius: 20px; }
        h1 { color: var(--primary); text-align: center; }
        textarea { width: 100%; height: 300px; background: #333; color: #fff; border-radius: 10px; padding: 10px; border: 1px solid #555; }
        .btn-gen { width: 100%; padding: 15px; background: var(--primary); font-weight: bold; border-radius: 50px; cursor: pointer; border:none; margin-top:20px; }
        
        .btn-link { display: none; width: 100%; padding: 12px; margin-top: 10px; background: #4CAF50; color: #fff; font-weight: bold; border-radius: 10px; text-align: center; text-decoration: none; cursor: pointer; }
        .btn-link.ext { background: #2196F3; } 
        
        .status { text-align: center; margin-top: 20px; color: #fff; white-space: pre-line; }
        
        /* 🔥 診斷日誌區 */
        .log-box { 
            display:none; width: 100%; margin-top: 15px; padding: 10px; 
            background: #222; border: 1px dashed #555; color: #aaa; 
            font-size: 12px; text-align: left; max-height: 150px; overflow-y: auto; 
        }

        input { background:#333; border:1px solid #555; color:#fff; padding:10px; border-radius:5px; width:45%; }
        .row { display:flex; justify-content:space-between; margin-bottom:15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 智慧排班表生成器 V5.5</h1>
        <div class="row">
            <input type="number" id="yearInput" value="2026">
            <input type="text" id="eventInput" value="元宵">
        </div>
        <textarea id="dataInput" placeholder="請貼上資料 (需包含 日期：YYYY/MM/DD)..."></textarea>
        
        <button id="genBtn" class="btn-gen" onclick="generate()">🚀 開始生成</button>
        
        <div id="status" class="status"></div>
        <div id="debugLog" class="log-box"></div>
        
        <a id="linkInternal" href="#" target="_blank" class="btn-link">📂 開啟內部排班表 (排班用)</a>
        <a id="linkExternal" href="#" target="_blank" class="btn-link ext">📂 開啟員工班表 (員工看)</a>
        
        <a href="dashboard.html" style="display:block; text-align:center; margin-top:20px; color:#888; text-decoration:none;">⬅️ 返回戰情室</a>
    </div>

    <script>
        // 🔴 請填入你的新 API
        const API_URL = "https://script.google.com/macros/s/AKfycbzHj3Az1iQpkKFVA465AWmCepNLODjbSbyAljoGvOCDPaHLZPWthOhM0OnpjfTjSdyw0w/exec"; 
        
        const URL_INT = "https://docs.google.com/spreadsheets/d/1GyPTKfZvHd7bHHiz2UMj5gfATwAhNCsqZwLmT1W-DsE/edit";
        const URL_EXT = "https://docs.google.com/spreadsheets/d/1j4RCgQoUBTMKWvTr7hgsw6ooPSdpWGFIjWm7WqgJYX8/edit";

        function generate() {
            const btn = document.getElementById('genBtn');
            const status = document.getElementById('status');
            const logBox = document.getElementById('debugLog');
            const linkInt = document.getElementById('linkInternal');
            const linkExt = document.getElementById('linkExternal');
            const text = document.getElementById('dataInput').value;

            if(!text.trim()) { alert("❌ 請貼上資料！"); return; }

            btn.disabled = true;
            btn.innerText = "⏳ 正在強力解析...";
            status.innerText = "資料傳送中...";
            logBox.style.display = 'none';
            linkInt.style.display = "none";
            linkExt.style.display = "none";

            fetch(API_URL, {
                method: "POST",
                mode: "text", // 嘗試取得回傳內容
                body: JSON.stringify({ 
                    year: document.getElementById('yearInput').value, 
                    eventName: document.getElementById('eventInput').value, 
                    text: text 
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    status.innerText = data.msg;
                    status.style.color = "#4CAF50";
                    linkInt.href = URL_INT; linkInt.style.display = "block";
                    linkExt.href = URL_EXT; linkExt.style.display = "block";
                } else {
                    status.innerText = data.msg;
                    status.style.color = "#FF5252";
                }
                
                // 顯示診斷日誌
                if (data.logs && data.logs.length > 0) {
                    logBox.innerHTML = "🔍 解析診斷：<br>" + data.logs.join("<br>");
                    logBox.style.display = "block";
                }
                
                btn.innerText = "🚀 再次生成";
                btn.disabled = false;
            })
            .catch(err => {
                // 如果是 CORS 擋住，我們假設成功 (盲送模式)
                status.innerText = "⚠️ 請求已送出 (無法確認回傳)，請直接檢查 Google Sheet。";
                status.style.color = "#FF9800";
                linkInt.href = URL_INT; linkInt.style.display = "block";
                linkExt.href = URL_EXT; linkExt.style.display = "block";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
